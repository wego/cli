# gitleaks configuration for wego/cli.
#
# Extends the default ruleset, so every stock rule still applies and this file
# only adds what the defaults cannot know.
#
# Scan the whole history, not the working tree, from a full clone:
#
#   gitleaks git --log-opts="--all" --redact .
#
# gitleaks 8.30.1 takes `git`, `dir` or `stdin`; `detect` and `protect` are gone.
# `ci-cli` runs the line above on every pull request and push to main, and
# `.husky/pre-commit` runs `gitleaks git --staged` before a commit exists.
#
# Use --redact: without it the report and terminal show matched values in
# cleartext, and this output is meant to be shared.
# Exit 0 is clean, exit 1 is findings, anything else is a tool error.
#
# The review behind the allowlist below: wego/foundations#141

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# The generated Sigstore test fixtures.
#
# src/release-signing/testing/fixture.ts is a generated file holding a real ECDSA
# P-256 certificate chain and real signatures, including the leaf's private key.
# It is safe to commit: the chain's root (TEST_ROOT_PEM, self-signed, CN "Test
# Fulcio Root") is trusted only by tests that pin it. The shipped binary pins the
# real Fulcio roots (src/release-signing/sigstore-roots.ts), so the key has
# authority nowhere.
#
# It lets update.test.ts run the real verifier instead of a stub, so fail-closed
# behaviour is actually tested.
#
# A path rule, not a fingerprint: the file changes whenever the chain is
# rebuilt, and a fingerprint (pinned to a commit and line) would go stale.
#
# The fixture must be regenerated when wego/foundations#134 removes the wego-ai
# signing identities: the accept-path leaf's SAN names
# https://github.com/wego/wego-ai/.github/workflows/release-cli.yml@refs/heads/main
# and will match nothing once those identities are gone. The negative control
# needs the same change (see that issue).
# ---------------------------------------------------------------------------

[allowlist]
description = "Generated Sigstore test fixtures: a throwaway P-256 chain for a throwaway root that nothing in production trusts. See the comment above and wego/foundations#141."
paths = ['''^src/release-signing/testing/fixture\.ts$''']
