name: Rollback (cli)

# PUT `cli/stable` BACK ON A NAMED EARLIER RELEASE.
#
# A SEPARATE LANE FROM `promote-cli.yml`, ON PURPOSE. Rollback used to be an input
# on the promote lane (`allow_not_next`), and that input was the defect: a boolean
# a human types which silently changes the meaning of twenty downstream steps.
# Every gate added to the promote lane had to REMEMBER to opt rollback out, the
# guard was documented per-step in prose and nowhere as a whole, and the first gate
# whose author did not reconstruct that invariant broke the rollback path outright -
# silently, because nothing exercises rollback until an incident (wego/cli#48 added
# two `cli/next`-coupled gates without the guard; both hard-failed every rollback).
#
# THE FIX IS DELETING THE MODE, NOT GUARDING IT. Promote now has no branches: it
# only ever moves `stable` onto what `next` serves, so every gate there may assume
# `next == tag` unconditionally. This file never mentions `next` at all, so no gate
# added here can couple to the thing that broke. Neither lane can break the other,
# and `scripts/workflow-lanes.test.ts` asserts both halves.
#
# THE POSTURE IS INVERTED FROM PROMOTE, WHICH IS THE WHOLE POINT. The promote lane
# is fail-closed by design - "almost everything it checks runs before the pointer
# moves, because a failure there costs a re-run". That is correct for promote,
# where a blocked run costs a re-run. It is WRONG here: a blocked rollback costs
# continued exposure to a build you have already decided is bad. So this lane
# carries two blocking checks, both cheap, and everything else runs AFTER the move
# where it cannot buy exposure with its own runtime.
#
# WHY THE BATTERY IS NOT REPEATED HERE. A rollback target is bytes that already
# served `cli/stable`. That is stronger evidence than any gate can manufacture -
# it shipped to the entire install base and survived. Re-running the promote gates
# against it can only produce false negatives, and it costs exposure minutes while
# it does. What is NOT already known is whether the frozen prefix is still intact,
# and that is what this lane checks.
#
# THE TAG IS MANDATORY. There is no default and no auto-resolution: computing "the
# previous stable" means reconstructing history from the Actions API, which adds a
# dependency the move itself does not have, for a fact the person dispatching
# already knows. `plan_only` is how you check yourself, not a lookup table.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The vX.Y.Z tag to put back on cli/stable. Must already be published. No default - name it explicitly.'
        required: true
        type: string
      reason:
        description: 'Why. Goes into the job summary, which is the only record this lane keeps.'
        required: true
        type: string
      plan_only:
        description: 'Run every check and STOP before the pointer moves. Nothing is written. Use this to rehearse.'
        required: false
        default: false
        type: boolean

# contents:read - this lane creates no tag and no Release, and unlike the promote
# lane it queries no API. It reads the store over HTTPS and writes one pointer.
permissions:
  contents: read

jobs:
  # THE HUMAN GATE, and nothing else. Identical in shape and reasoning to the
  # promote lane's: not an environment, because required-reviewer protection is
  # Enterprise-only on a private repo and declaring the environment anyway would
  # create it UNPROTECTED and wave every dispatch through (wego/foundations#128).
  #
  # What gates a rollback instead, both enforced: this workflow has no trigger but
  # `workflow_dispatch`, and this job refuses anyone not on the list. The list is
  # meaningful because `main` requires a code-owner review, so widening it is a
  # reviewed change.
  #
  # Holds NO secrets and NO variables - there is nothing in it to leak - and
  # `rollback` cannot begin until it has passed.
  approve:
    name: Approve rolling cli/stable back to ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only a named promoter may roll back
        env:
          ACTOR: ${{ github.actor }}
          PROMOTERS: sunny-wego yeouchien-wego chuyeowego
        run: |
          set -euo pipefail
          for promoter in $PROMOTERS; do
            if [ "$promoter" = "$ACTOR" ]; then
              echo "$ACTOR is a named promoter."
              exit 0
            fi
          done
          echo "::error::$ACTOR is not a named promoter. Allowed: $PROMOTERS"
          exit 1

  rollback:
    name: Rollback cli/stable to ${{ inputs.tag }}
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE SAME GROUP STRING AS `promote-cli.yml`. Concurrency groups are scoped to
    # the repository, not the workflow, so naming the group `ring-stable` in both
    # files is what serialises a rollback against a promote. Two lanes, one queue
    # slot, because they write the same pointer.
    #
    # cancel-in-progress is FALSE for the reason it is there in the promote lane: a
    # move aborted between copying the binaries and copying the manifest leaves
    # `stable` half-written.
    concurrency:
      group: ring-stable
      cancel-in-progress: false
    # The store token lives here. `approve` gated entry; this environment is what
    # actually holds the credential that selects a store.
    environment:
      name: production
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      # `main`, NOT the tag - the opposite of the promote lane, deliberately.
      #
      # `promote-cli.yml` checks out `ref: inputs.tag` because its plugin publisher
      # reads the tag's own tree. This lane publishes no plugin (see the header of
      # the summary step), so it reads nothing from the tag's tree - and checking
      # out `main` means a rollback always runs TODAY'S `upgrade-path.sh`,
      # `verify-published.sh` and publisher, rather than whatever those scripts
      # looked like at a tag cut months ago. A lane that runs an old tag's scripts
      # against today's interfaces is a failure waiting for the one day it matters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # BLOCKING, ~1s, NO NETWORK. The tag is the only thing a human can get wrong
      # now that there is no default, so it is the only input-shaped gate this lane
      # needs. `validate-release-tag.ts` is the same authority the release and
      # promote lanes use, so all three agree on what a tag is.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/validate-release-tag.ts "$TAG"
          case "${TAG#v}" in
            *-*)
              echo "::error::$TAG is a prerelease. cli/stable serves only a plain X.Y.Z."
              exit 1 ;;
          esac
          echo "ok: $TAG is a plain release version."

      # NON-BLOCKING, ON PURPOSE. This is the build being rolled back FROM, and the
      # only consumer is the rescue check after the move, which asks whether
      # machines already on it can get off it.
      #
      # An informational read must never stand between a person and the fix. If
      # `api.wego.com` will not answer, the rollback is still both possible and
      # correct - the rescue check simply cannot run, and says so.
      - name: Record what cli/stable serves today
        id: outgoing
        run: |
          set -euo pipefail
          version=$(curl -fsSL 'https://api.wego.com/install?dl=VERSION&ring=stable' 2>/dev/null || true)
          version=$(printf '%s' "$version" | tr -d '\r\n')
          if [ -z "$version" ]; then
            echo "::warning::could not read cli/stable's current VERSION - the rescue check will be skipped and the summary will say so."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # THE TAG GRAMMAR CHANGED AT THE RELAY: wego-ai published `cli-vX.Y.Z` up
          # to 1.1.0, wego/cli publishes `vX.Y.Z` from 1.2.0 on. The rescue check
          # below fetches the outgoing binary by its frozen prefix, so it needs the
          # right spelling for the version it actually found.
          case "$version" in
            1.0.*|1.1.*) tag="cli-v$version" ;;
            *)           tag="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cli/stable serves $version today (frozen prefix cli/$tag)."

      # BLOCKING, ~2s, TWO CURLS. The one thing a rollback target's own history
      # CANNOT vouch for: that its frozen prefix is still intact TODAY. An object
      # can be collected, and a release lane can have written a short manifest.
      #
      # THE ASSET SET IS PINNED AS A LITERAL, not derived from the manifest being
      # checked - it is the assertion, not a restatement of the thing asserted.
      # `verify-published.sh` only checksums what the manifest lists, so a prefix
      # missing a platform passes every hash check and strands every install on
      # that platform with a download that 404s, forever.
      #
      # The store origin is read out of the install route's redirect rather than
      # hardcoded, exactly as the promote lane does it: nothing in either lane
      # names a store host.
      - name: Require the rollback target to be intact
        id: target
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=stable' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/stable/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect: '$loc'. Refusing to move cli/stable on an unverified route."
            exit 1
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

          if ! curl -fsSL "$origin/cli/$TAG/SHA256SUMS.txt" > "$RUNNER_TEMP/tag.sums"; then
            echo "::error::cli/$TAG has no SHA256SUMS.txt in the store. Either $TAG was never published, or its frozen prefix is gone. NOTHING HAS MOVED."
            exit 1
          fi

          # Every platform this project ships, raw and gzipped, plus VERSION.
          expected='VERSION
          wego-darwin-arm64
          wego-darwin-arm64.gz
          wego-darwin-x64
          wego-darwin-x64.gz
          wego-linux-arm64
          wego-linux-arm64.gz
          wego-linux-x64
          wego-linux-x64.gz
          wego-windows-x64.exe
          wego-windows-x64.exe.gz'
          printf '%s\n' "$expected" | sed 's/^ *//' | sort > "$RUNNER_TEMP/expected.names"
          awk '{print $2}' "$RUNNER_TEMP/tag.sums" | sort > "$RUNNER_TEMP/actual.names"
          if ! diff -u "$RUNNER_TEMP/expected.names" "$RUNNER_TEMP/actual.names"; then
            echo "::error::cli/$TAG does not carry exactly the expected asset set (- expected, + found above). A MISSING asset strands every install on that platform: it would be offered a download that 404s, forever. NOTHING HAS MOVED - pick a different target."
            exit 1
          fi
          echo "ok: cli/$TAG is intact and carries every expected platform."

      - name: Plan
        if: ${{ inputs.plan_only }}
        env:
          TAG: ${{ inputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Plan only - nothing moved"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Would move \`cli/stable\` to | \`$TAG\` |"
            echo "| Replacing | \`${OUTGOING:-unknown}\` |"
            echo "| Reason | $REASON |"
            echo
            echo "The target is published and intact. Re-dispatch without \`plan_only\` to move the pointer."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE MOVE. A server-side copy of the frozen cli/<tag> blobs onto cli/stable.
      #
      # NO `--require-serving`. The promote lane passes `--require-serving next`
      # because its whole premise is that the bytes have been exercised on that
      # ring. Here there is no ring serving this target - that is precisely why
      # this lane exists, and asserting otherwise is what broke rollback before.
      #
      # REQUIRE_PUBLISH: an absent token must FAIL here rather than exit 0 having
      # moved nothing. A rollback that reports success while the whole install base
      # is still on the broken build is the worst outcome this lane can produce.
      #
      # EVERY INSTALL IS ON THE OLD BYTES FROM THE MOMENT THIS STEP RETURNS.
      # `wego update` compares CHECKSUMS, not versions (`src/update.ts`), so an
      # earlier release is taken exactly the way a later one is - no reinstall, no
      # deadline, no version ordering anywhere. Everything below this point is
      # verification and costs nobody any exposure.
      - name: Move cli/stable back to ${{ inputs.tag }}
        id: move
        if: ${{ !inputs.plan_only }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: 'true'
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/upload-release-blob.ts --promote "$TAG" --to stable

      # THE QUESTION THE WHOLE OPERATION EXISTS TO ANSWER, and the one nothing in
      # the promote lane asks: can the machines that already took the bad build get
      # OFF it?
      #
      # The promote lane's install-base walks drive 1.1.0 and 1.0.1 - the OLD
      # population. The population a rollback is trying to rescue is the one on the
      # build being rolled back FROM, and its route is exactly this: outgoing
      # binary, ring stable, one hop, onto the target.
      #
      # POST-MOVE ON PURPOSE, and it could not be otherwise: `cli/stable` has to
      # already serve the target for this to mean anything. It therefore costs zero
      # exposure - the fix is already propagating while this runs.
      #
      # NON-BLOCKING. The move happened and was correct either way; this step's job
      # is to tell you WHICH incident you are now in:
      #   passes - every affected machine self-heals on its next check. Done.
      #   fails  - this rollback protected everyone who had not updated yet and
      #            nobody who had. Those machines need a manual reinstall, and you
      #            need to know that in minutes rather than from support tickets.
      - name: Can machines on the bad build reach this rollback
        id: rescue
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        continue-on-error: true
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          OUTGOING_TAG: ${{ steps.outgoing.outputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$OUTGOING" ]; then
            echo "::warning::cli/stable's outgoing VERSION could not be read before the move, so the rescue path cannot be exercised. The rollback stands; verify by hand that a $OUTGOING install can update."
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OUTGOING" = "${TAG#v}" ]; then
            echo "cli/stable already served ${TAG#v} - nothing was rolled back, so there is no rescue path to walk."
            echo "verdict=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh scripts/upgrade-path.sh \
               "$ORIGIN/cli/$OUTGOING_TAG/wego-linux-x64" stable "${TAG#v}" --max-hops 1; then
            echo "ok: a $OUTGOING install reaches ${TAG#v} on cli/stable. Every affected machine self-heals on its next update."
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verdict=failed" >> "$GITHUB_OUTPUT"
          echo "::error::machines already on $OUTGOING CANNOT reach ${TAG#v} on cli/stable. THE ROLLBACK ITSELF IS DONE AND IS CORRECT for everyone who had not yet updated - but it did not rescue anyone who had. Those machines cannot be reached by a further pointer move either (a binary that cannot take an update cannot take the fix): they need a manual reinstall. Exit 6 means a signed record $OUTGOING does not accept."
          # Fails the STEP (red, with the annotation above) but not the job:
          # `continue-on-error` is what keeps the summary and the rest running. A
          # green step carrying a red annotation would read as "fine" at a glance,
          # which is the opposite of what this result means.
          exit 1

      # Verification, not a gate. Every asset on the ring hash-checked against the
      # manifest the move just committed. Last because it is ~440MB of downloads
      # and the least time-critical thing here - by now the fix has been live for
      # a minute.
      - name: Verify cli/stable
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        continue-on-error: true
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          TAG: ${{ inputs.tag }}
        run: sh scripts/verify-published.sh "$ORIGIN/cli/stable" "${TAG#v}" all

      # NO PLUGIN PUBLISH, DELIBERATELY.
      #
      # `promote-cli.yml` pushes the tag's plugin content to `wego/skills`. This
      # lane does not, because the two channels serve different populations and
      # only one of them needs anything from a rollback:
      #
      #   CLI installs  - the SKILL.md ships EMBEDDED in the binary, and `update`
      #                   re-runs the freshly swapped binary's own
      #                   `skill install --owned-only` (src/update.ts:325). A
      #                   machine taking the rollback therefore gets that release's
      #                   skills automatically. Nothing to publish.
      #   wego/skills   - third-party discovery reads the plugin content from there
      #                   (scripts/plugin-publish.ts). Those consumers never follow
      #                   `cli/stable`, so a rollback does not reach them either
      #                   way; the repo simply sits one version ahead until the
      #                   next forward promote resynchronises it.
      #
      # `promote-cli.yml` already makes this call in its own words: "a rollback
      # that cannot run is a worse failure than a plugin repo that lags by one
      # tag". Keeping the publisher out of this lane also keeps the App token, the
      # `wego/skills` dependency and the tag checkout out of an emergency path.

      # THE ONLY RECORD THIS LANE KEEPS, and it is enough. The Actions run list
      # already carries the tag and the timestamp in this job's NAME, so the run
      # history IS the rollback history - no ledger file, no artifact upload, no
      # store write, nothing that can fail and nothing new to read back.
      - name: Summary
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        env:
          TAG: ${{ inputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          REASON: ${{ inputs.reason }}
          VERDICT: ${{ steps.rescue.outputs.verdict }}
        run: |
          {
            echo "### Rolled \`cli/stable\` back to \`$TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Now serving | \`$TAG\` |"
            echo "| Replaced | \`${OUTGOING:-unknown}\` |"
            echo "| Reason | $REASON |"
            echo
            case "$VERDICT" in
              ok)
                echo "**Machines on \`$OUTGOING\` reach this build.** Every affected install self-heals on its next \`wego update\`. No further action." ;;
              failed)
                echo "**Machines on \`$OUTGOING\` CANNOT reach this build.** The rollback is correct for everyone who had not yet updated, but it did not rescue anyone who had - and no further pointer move will reach them. Notify users on \`$OUTGOING\` and publish reinstall instructions." ;;
              noop)
                echo "\`cli/stable\` already served this version - nothing moved." ;;
              *)
                echo "**The rescue path could not be checked.** Verify by hand that a \`${OUTGOING:-previous}\` install can update." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
