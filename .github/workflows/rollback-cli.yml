name: Rollback (cli)

# Move `cli/stable` back to a named earlier release.
#
# A separate workflow from `promote-cli.yml`. Rollback used to be an input on the
# promote lane that removed gates. Two gates added without that guard broke every
# rollback (wego/cli#48). This file has no executable reference to `cli/next`, so
# no gate here can depend on it. `scripts/workflow-lanes.test.ts` asserts that.
#
# Posture. A blocked rollback extends exposure to a bad build. Two cheap checks
# block. Everything else runs after the move. The promote gates are not repeated:
# the target already served `cli/stable`, and that is stronger evidence than a gate.
#
# The tag has no default. Use `plan_only` to rehearse without moving anything.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The vX.Y.Z tag to put back on cli/stable. Must already be published. No default - name it explicitly.'
        required: true
        type: string
      reason:
        description: 'Why. Goes into the job summary, which is the only record this lane keeps.'
        required: true
        type: string
      plan_only:
        description: 'Run every check and STOP before the pointer moves. Nothing is written. Use this to rehearse.'
        required: false
        default: false
        type: boolean

# No tag and no Release is created. This lane reads the store over HTTPS and writes
# one pointer.
permissions:
  contents: read

jobs:
  # The human gate. Same shape and same reasoning as `promote-cli.yml`: not an
  # environment with required reviewers (see that file). The list below is the
  # authority. `main` requires a code-owner review, so a change to it is reviewed.
  # This job holds no secrets and no variables.
  #
  # Both actors must be promoters, as in the promote lane. A replay matters more
  # here: it puts `cli/stable` back on this run's `inputs.tag`, which moves the
  # whole install base onto an older release once stable has advanced past it.
  approve:
    name: Approve rolling cli/stable back to ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only a named promoter may roll back
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROMOTERS: sunny-wego yeouchien-wego chuyeowego
        run: |
          set -euo pipefail

          is_promoter() {
            candidate="$1"
            for p in $PROMOTERS; do
              if [ "$p" = "$candidate" ]; then return 0; fi
            done
            return 1
          }

          # `github.actor` is the ORIGINAL dispatcher and does NOT change on a
          # re-run; `github.triggering_actor` is whoever started THIS run. Both
          # must be promoters. Checking only the first lets anyone with write
          # access re-run a past run of this lane and have the gate pass on the
          # original promoter's name - which for the rollback lane is a replay
          # that moves `cli/stable` onto an old tag.
          #
          # Call `is_promoter` inside an `if !` condition, never as a bare
          # statement: `set -e` is suspended for a command used as a condition,
          # and writing the loop body as `[ ... ] && return 0` would make a
          # non-matching iteration return non-zero and trip `set -e`.
          if ! is_promoter "$ACTOR"; then
            echo "::error::$ACTOR is not a named promoter. Allowed: $PROMOTERS"
            exit 1
          fi
          if ! is_promoter "$TRIGGERING_ACTOR"; then
            echo "::error::$TRIGGERING_ACTOR re-ran this run and is not a named promoter. Allowed: $PROMOTERS"
            exit 1
          fi

          echo "$ACTOR dispatched and $TRIGGERING_ACTOR ran this; both are named promoters."

  rollback:
    name: Rollback cli/stable to ${{ inputs.tag }}
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group string as `promote-cli.yml`. Concurrency groups are repository-wide,
    # so this serialises a rollback against a promote. Do not cancel a move in
    # progress: it leaves `cli/stable` half-written.
    concurrency:
      group: ring-stable
      cancel-in-progress: false
    # The store token lives here.
    environment:
      name: production
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      # `main`, not the tag. This lane reads nothing from the tag's tree, so it runs
      # today's scripts against today's store.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # Blocking. No network. The tag is the only input a person can get wrong.
      # Same parser as the release and promote lanes.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/validate-release-tag.ts "$TAG"
          case "${TAG#v}" in
            *-*)
              echo "::error::$TAG is a prerelease. cli/stable serves only a plain X.Y.Z."
              exit 1 ;;
          esac
          echo "ok: $TAG is a plain release version."

      # Not blocking. Only the rescue check after the move uses this value. If the
      # route does not answer, the rollback still proceeds.
      #
      # Tag grammar: wego-ai published `cli-vX.Y.Z` up to 1.1.0. This repository
      # publishes `vX.Y.Z` from 1.2.0.
      - name: Record what cli/stable serves today
        id: outgoing
        run: |
          set -euo pipefail
          version=$(curl -fsSL 'https://api.wego.com/install?dl=VERSION&ring=stable' 2>/dev/null || true)
          version=$(printf '%s' "$version" | tr -d '\r\n')
          if [ -z "$version" ]; then
            echo "::warning::could not read cli/stable's current VERSION - the rescue check will be skipped and the summary will say so."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$version" in
            1.0.*|1.1.*) tag="cli-v$version" ;;
            *)           tag="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cli/stable serves $version today (frozen prefix cli/$tag)."

      # Blocking. Two requests. Require the frozen prefix to exist and to carry
      # exactly the expected asset set. `verify-published.sh` checks only what the
      # manifest lists, so a prefix that lost a platform would pass it. The list is
      # a literal on purpose. The store origin is read from the install route's
      # redirect; no store host is named in this file.
      - name: Require the rollback target to be intact
        id: target
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=stable' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/stable/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect: '$loc'. Refusing to move cli/stable on an unverified route."
            exit 1
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

          if ! curl -fsSL "$origin/cli/$TAG/SHA256SUMS.txt" > "$RUNNER_TEMP/tag.sums"; then
            echo "::error::cli/$TAG has no SHA256SUMS.txt in the store. Either $TAG was never published, or its frozen prefix is gone. NOTHING HAS MOVED."
            exit 1
          fi

          # Every platform, raw and gzipped, plus VERSION.
          expected='VERSION
          wego-darwin-arm64
          wego-darwin-arm64.gz
          wego-darwin-x64
          wego-darwin-x64.gz
          wego-linux-arm64
          wego-linux-arm64.gz
          wego-linux-x64
          wego-linux-x64.gz
          wego-windows-x64.exe
          wego-windows-x64.exe.gz'
          printf '%s\n' "$expected" | sed 's/^ *//' | sort > "$RUNNER_TEMP/expected.names"
          awk '{print $2}' "$RUNNER_TEMP/tag.sums" | sort > "$RUNNER_TEMP/actual.names"
          if ! diff -u "$RUNNER_TEMP/expected.names" "$RUNNER_TEMP/actual.names"; then
            echo "::error::cli/$TAG does not carry exactly the expected asset set (- expected, + found above). A MISSING asset strands every install on that platform: it would be offered a download that 404s, forever. NOTHING HAS MOVED - pick a different target."
            exit 1
          fi
          echo "ok: cli/$TAG is intact and carries every expected platform."

      # `plan_only` stops here.
      - name: Plan
        if: ${{ inputs.plan_only }}
        env:
          TAG: ${{ inputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Plan only - nothing moved"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Would move \`cli/stable\` to | \`$TAG\` |"
            echo "| Replacing | \`${OUTGOING:-unknown}\` |"
            echo "| Reason | $REASON |"
            echo
            echo "The target is published and intact. Re-dispatch without \`plan_only\` to move the pointer."
          } >> "$GITHUB_STEP_SUMMARY"

      # The move: a server-side copy of `cli/<tag>/` to `cli/stable`.
      #
      # No `--require-serving`: no ring serves the target, and that is why this
      # lane exists. REQUIRE_PUBLISH: a missing token fails instead of exit 0.
      #
      # `wego update` compares checksums, not versions. Every install on stable takes
      # the target bytes at its next check. Everything below is verification.
      - name: Move cli/stable back to ${{ inputs.tag }}
        id: move
        if: ${{ !inputs.plan_only }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: 'true'
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/upload-release-blob.ts --promote "$TAG" --to stable

      # Can machines on the bad build reach the target? Runs after the move because
      # `cli/stable` must serve the target first. Not blocking: the move is done
      # either way.
      #
      #   pass   every affected machine self-heals at its next update.
      #   fail   the rollback protected machines that had not updated. Machines
      #          already on the bad build need a manual reinstall.
      - name: Can machines on the bad build reach this rollback
        id: rescue
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        continue-on-error: true
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          OUTGOING_TAG: ${{ steps.outgoing.outputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$OUTGOING" ]; then
            echo "::warning::cli/stable's outgoing VERSION could not be read before the move, so the rescue path cannot be exercised. The rollback stands; verify by hand that a $OUTGOING install can update."
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OUTGOING" = "${TAG#v}" ]; then
            echo "cli/stable already served ${TAG#v} - nothing was rolled back, so there is no rescue path to walk."
            echo "verdict=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sh scripts/upgrade-path.sh \
               "$ORIGIN/cli/$OUTGOING_TAG/wego-linux-x64" stable "${TAG#v}" --max-hops 1; then
            echo "ok: a $OUTGOING install reaches ${TAG#v} on cli/stable. Every affected machine self-heals on its next update."
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verdict=failed" >> "$GITHUB_OUTPUT"
          echo "::error::machines already on $OUTGOING CANNOT reach ${TAG#v} on cli/stable. THE ROLLBACK ITSELF IS DONE AND IS CORRECT for everyone who had not yet updated - but it did not rescue anyone who had. Those machines cannot be reached by a further pointer move either (a binary that cannot take an update cannot take the fix): they need a manual reinstall. Exit 6 means a signed record $OUTGOING does not accept."
          # Exit 1 marks the step red. continue-on-error keeps the summary running.
          exit 1

      # Not blocking. Hash-check every asset on the ring. Last, because it downloads
      # about 440 MB.
      - name: Verify cli/stable
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        continue-on-error: true
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          TAG: ${{ inputs.tag }}
        run: sh scripts/verify-published.sh "$ORIGIN/cli/stable" "${TAG#v}" all

      # No plugin publish. The SKILL.md ships inside the binary, and `update` runs
      # `skill install --owned-only` after the swap. `wego/skills` serves third-party
      # discovery only and stays one version ahead until the next promote.
      #
      # The run history is the rollback record. There is no ledger.
      - name: Summary
        if: ${{ !inputs.plan_only && steps.move.outcome == 'success' }}
        env:
          TAG: ${{ inputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          REASON: ${{ inputs.reason }}
          VERDICT: ${{ steps.rescue.outputs.verdict }}
        run: |
          {
            echo "### Rolled \`cli/stable\` back to \`$TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Now serving | \`$TAG\` |"
            echo "| Replaced | \`${OUTGOING:-unknown}\` |"
            echo "| Reason | $REASON |"
            echo
            case "$VERDICT" in
              ok)
                echo "**Machines on \`$OUTGOING\` reach this build.** Every affected install self-heals on its next \`wego update\`. No further action." ;;
              failed)
                echo "**Machines on \`$OUTGOING\` CANNOT reach this build.** The rollback is correct for everyone who had not yet updated, but it did not rescue anyone who had - and no further pointer move will reach them. Notify users on \`$OUTGOING\` and publish reinstall instructions." ;;
              noop)
                echo "\`cli/stable\` already served this version - nothing moved." ;;
              *)
                echo "**The rescue path could not be checked.** Verify by hand that a \`${OUTGOING:-previous}\` install can update." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
