name: ci-cli

# Lint/format + typecheck + unit tests. Everything in this repository is the CLI,
# so there is no path filter and no aggregator job: in wego-ai this workflow
# carried both because a change to another app had to skip the work while still
# reporting a required check. One package, one job - and that job IS the required
# status check on `main`, which is why it is named `ci-cli` and why the name must
# not change without a ruleset edit.
#
# No signing here. Signing belongs to the release lanes, which hold the identity
# and the store token; CI runs on every pull request and holds neither.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-cli:
    name: ci-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job (no git push / auth) - don't persist the token in
          # .git/config (artipacked hardening; flagged by zizmor).
          persist-credentials: false

      # Composite action: setup-bun + restore cache + frozen install (+ save on main).
      # NO `production:` here - lint, typecheck and the test suite need the
      # devDependencies. The flag belongs to the two build jobs only.
      - uses: ./.github/actions/setup-bun

      # AUTHENTICITY, which `bun.lock` does not provide. The lockfile records a
      # sha512 per package, and that proves the bytes have not changed SINCE WE
      # FIRST FETCHED THEM - integrity. It proves nothing about whether those
      # bytes were ever legitimate, because the hash is minted from whatever the
      # registry served at the moment of the bump. The window is the instant a
      # version is first pinned, which is exactly when a compromised upstream
      # release would enter (wego/foundations#182).
      #
      # `npm audit signatures` closes that: it walks the installed tree - it needs
      # no `package-lock.json`, so it reads exactly what bun linked - and checks
      # each tarball against the registry's signature, plus the publisher's
      # provenance attestation where one exists. It exits non-zero on any invalid
      # or missing signature. Confirmed green on this tree today, so it starts
      # quiet: 74 packages verified, 13 carrying attestations, 0 invalid, 0
      # missing.
      #
      # WHAT IT DOES NOT DO: check WHICH upstream identity published a package. A
      # valid attestation naming the wrong repository still passes. Pinning the
      # expected builder identity - the way `src/release-signing/identity.ts`
      # pins ours - is the open half of wego/foundations#182.
      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Lint & format check (biome check)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Hermetic and network-free: every test runs against injected deps or a
      # temp dir. The three suites that needed the real `apps/api` in the same
      # tree stayed in wego-ai.
      - name: Unit tests
        run: bun run test
