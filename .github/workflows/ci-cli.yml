name: ci-cli

# Lint, typecheck, unit tests and the integration suite. Runs on every pull
# request and every push to main.
#
# The job name `ci-cli` is the required status check on `main`. Do not rename it
# without a ruleset change. There is no path filter: a filtered workflow does not
# report, and a required check that does not report blocks the pull request.
#
# This workflow does not sign. Only the release lanes sign.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-cli:
    name: ci-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job. Do not keep the token in .git/config.
          persist-credentials: false
          # Full history, for the gitleaks step below. It scans every ref, which is
          # what the .gitleaksignore fingerprints (commit:file:rule:line) are keyed
          # to; a shallow clone would scan one commit and silently pass.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # The PR title is the release contract, not the commit messages: PRs are
      # squashed, the squash subject comes from the title, and release-please reads
      # that subject to compute the next version. A mistyped type silently produces
      # no release. `.husky/commit-msg` runs the same check locally but cannot see
      # the title, so it is enforced here.
      #
      # The title goes through `env:`, never into the `run:` string: it is
      # attacker-controlled text on a public repository.
      #
      # Bots are skipped: gating a bot's title would fail the required check on a
      # PR no human can retitle. Dependabot (configured in `dependabot.yml`) and
      # release-please already write Conventional Commit titles.
      - name: Pull request title is a Conventional Commit
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run scripts/commit-convention.ts --title "$PR_TITLE"

      - name: Lint & format check (biome check)
        run: bun run lint

      # No separate generate step: `bun run typecheck` regenerates
      # `src/api-types.d.ts` itself, so CI, the release lane and a local terminal
      # compile against the same types.
      #
      # The file is generated from `contract/openapi.json` and not committed.
      # Without it, the checks in `src/api-contract.ts` resolve to `never` instead
      # of failing. `postinstall` also writes it, but a cache hit or
      # `--ignore-scripts` can skip that. `scripts/ci-contract-drift.test.ts`
      # asserts typecheck owns the generation.
      - name: Typecheck
        run: bun run typecheck

      # The tests use no network. Each test runs against injected dependencies or a
      # temporary directory.
      - name: Unit tests
        run: bun run test

      # The CLI vendors the API's contract at `contract/openapi.json` because the
      # API lives in another repository. This step warns when the vendored copy is
      # stale.
      #
      # Warning only. `ci-cli` is the required check on `main` and the API deploys
      # on its own schedule, so a gate here would block every CLI PR after an
      # unrelated API release. A release-time check runs the released CLI against
      # the live API and catches real breaks.
      #
      # `servers` is dropped from both sides: it names the serving host, which is
      # not drift.
      #
      # Both `continue-on-error` and `exit 0` on every path, under `set +e`. Either
      # is enough alone; the pair stops a later edit from making this a blocker by
      # accident. `scripts/ci-contract-drift.test.ts` asserts it.
      - name: Contract drift (warning only)
        continue-on-error: true
        run: |
          # GitHub's default shell is `bash -e`, which would abort on any
          # unguarded failure below and hand the job a non-zero status before
          # the trailing `exit 0` ever ran. Turn it off here, in the script,
          # rather than relying on a `shell:` override staying put.
          set +e
          live="$RUNNER_TEMP/openapi-live.json"
          if ! curl -sS --retry 3 --max-time 20 -o "$live" https://api.wego.com/openapi; then
            echo "::notice::contract drift not checked: could not fetch https://api.wego.com/openapi"
            exit 0
          fi
          if ! jq -e 'type == "object" and has("openapi") and has("paths") and (.info.version | type == "string")' "$live" >/dev/null 2>&1; then
            echo "::notice::contract drift not checked: the fetched body is not a contract document"
            exit 0
          fi
          committed_version="$(jq -r '.info.version' contract/openapi.json)"
          live_version="$(jq -r '.info.version' "$live")"
          jq -S 'del(.servers)' contract/openapi.json > "$RUNNER_TEMP/committed.norm.json"
          jq -S 'del(.servers)' "$live" > "$RUNNER_TEMP/live.norm.json"
          if [ "$committed_version" = "$live_version" ] && cmp -s "$RUNNER_TEMP/committed.norm.json" "$RUNNER_TEMP/live.norm.json"; then
            echo "contract $committed_version matches the published document"
            exit 0
          fi
          echo "::warning::contract $committed_version committed, $live_version live; run bun run api-contract:refresh and commit the diff"
          diff -u "$RUNNER_TEMP/committed.norm.json" "$RUNNER_TEMP/live.norm.json" | head -200 || true
          exit 0

      # The shell scripts in `scripts/` drive real installs and updates on users'
      # machines, and `.husky/` holds the hooks. CodeRabbit also runs shellcheck,
      # but only as a review comment; here it blocks. shellcheck ships on the
      # runner image, so there is nothing to install or pin.
      #
      # The hooks have no extension and no shebang (husky supplies `sh -e`), so the
      # shell has to be named.
      #
      # `--severity=warning` because the runner's older shellcheck raises `info`
      # notes (such as SC2015) that current versions do not, and the verdict should
      # not depend on the version. Warnings and errors still block; `info` and
      # `style` notes are left to CodeRabbit.
      - name: Shell scripts (shellcheck)
        run: |
          shellcheck --severity=warning scripts/*.sh
          find .husky -maxdepth 1 -type f -print0 | xargs -0 shellcheck --severity=warning --shell=sh

      # actionlint resolves every `${{ }}` expression against the contexts GitHub
      # supplies. It catches, for example, a `needs.<job>.outputs.<name>` that the
      # job does not declare or that has no `needs:` edge. Those evaluate to the
      # empty string instead of erroring, so an `if:` using one is always false and
      # its step silently never runs.
      #
      # actionlint does not read composite actions;
      # `scripts/workflow-contexts.test.ts` covers those.
      #
      # Pinned by version and checksum: this is a required check, so an unpinned
      # download would let an upstream release fail the branch. Take the digest
      # from the published file when the version moves:
      # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
      #
      # It also runs shellcheck on every `run:` body, which the step above does
      # not cover.
      - name: Workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # `.husky/pre-commit` scans staged changes before a commit exists. This step
      # catches what arrived without the hook (`--no-verify`, a clone that never ran
      # `bun install`, a commit made in the GitHub UI), and blocks.
      #
      # Scans every ref because the `.gitleaksignore` baseline is keyed to
      # commit:file:rule:line and only matches a history scan. Both config files
      # are picked up from the repository root.
      #
      # Pinned by version and checksum. Take the digest from the published file
      # when the version moves:
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      - name: Scan every ref for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner .

      # GitHub's dependency graph does not resolve `bun.lock`, so Dependabot alerts
      # miss the transitive tree. `bun audit` reads the lockfile and is the only
      # check here that sees it.
      #
      # No `|| true` or `continue-on-error`: a finding blocks the merge on purpose,
      # since a job that stays green while reporting findings gets ignored. Running
      # on push to `main` re-audits on every merge, in place of a scheduled scan.
      # Not repeated in `edge-cli.yml`, which runs on the same push.
      - name: Audit the installed dependency tree (bun.lock)
        run: bun audit --audit-level=high

      # The compiled `wego` binary against a local fake API (`integration/`). The
      # unit tests run the source; this runs what `bun build --compile` ships. The
      # fake is on loopback and every other request is refused, so a failure here
      # is the change, not the network.
      #
      # A step, not a job, so the one required check on `main` covers it without a
      # ruleset change. linux-x64 only: the suite compiles the host binary when
      # `WEGO_INTEGRATION_BINARY` is unset. The other four targets run in
      # `release-cli.yml` against the binaries that release built.
      - name: Integration tests (compiled binary, fake API)
        env:
          # The suite drives a production build. Do not post CI runs as product usage.
          WEGO_CLI_TELEMETRY: "0"
        run: bun run test:integration
