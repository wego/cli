name: fulcio-pin-check

# Compare the Fulcio roots pinned in `src/release-signing/sigstore-roots.ts` with
# what https://fulcio.sigstore.dev/api/v1/rootCert serves.
#
# Every binary carries the pinned roots. If Sigstore starts to issue leaf
# certificates under other material, every installed binary refuses every new
# release and cannot take a fix. The release lanes stay green: they get a fresh
# certificate on each run. This check is the only notice. A rotation is a code
# change to `sigstore-roots.ts`, reviewed and released like any other.
#
# A weekly schedule, not a gate in the release lanes: the risk is rare, sudden, and
# hits every install at once. One HTTPS request, about 2 seconds.
on:
  schedule:
    # Monday 07:00 UTC, so a rotation is found with the working week ahead.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  # Also on a pull request that changes the pin or the checker.
  pull_request:
    paths:
      - 'src/release-signing/sigstore-roots.ts'
      - 'scripts/check-fulcio-pin.ts'

permissions:
  contents: read

jobs:
  check:
    name: Pinned Fulcio roots match the live bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # For the issue below. A red scheduled run reaches nobody on its own.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # The script output is captured for the issue body.
      - name: Compare the pin against fulcio.sigstore.dev
        id: check
        run: |
          set -euo pipefail
          if bun run scripts/check-fulcio-pin.ts 2>&1 | tee "$RUNNER_TEMP/result.txt"; then
            exit 0
          fi
          {
            echo 'drift<<RESULT_EOF'
            cat "$RUNNER_TEMP/result.txt"
            echo 'RESULT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit 1

      # One open issue, not one per week. Skipped on pull requests: the red check
      # on the PR is the notice, and a fork PR cannot write issues.
      - name: Open an issue if the pin has drifted
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT: ${{ steps.check.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = "Fulcio trust anchors have drifted from the pinned set";
            // Match on the title. The label may not exist the first time this runs.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (open.some((i) => i.title === title)) {
              core.info("An open issue already tracks this drift - not filing another.");
              return;
            }
            const body = [
              process.env.DRIFT ||
                "The check failed without producing a comparison - see the run log; it may be that fulcio.sigstore.dev could not be reached, which fails deliberately rather than being read as agreement.",
              "",
              `Run: ${process.env.RUN_URL}`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["release-signing"],
            });
