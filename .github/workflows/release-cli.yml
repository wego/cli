name: Release (cli)

# Build the `wego` CLI for a `vX.Y.Z` tag, publish it to the immutable `cli/<tag>/`
# prefix in the public Vercel Blob store, and move `cli/next` to it. The store backs
# `GET https://api.wego.com/install`.
#
# Entry: a `v*` tag push, and nothing else. No `workflow_call`, no
# `workflow_dispatch`, no typed version. release-please pushes the tag with an App
# token when the release PR merges. A tag pushed by hand also works if its commit
# is on main.
#
# Rings (`scripts/ring-rules.ts`):
#   cli/edge    unreleased main, dogfood   edge-cli.yml
#   cli/next    the release candidate      this workflow, on every release
#   cli/stable  what everyone receives     promote-cli.yml, a human decision
# `next` and `stable` serve the same bytes. A promote copies `cli/<tag>/`. Nothing
# is rebuilt.
#
# One build. `--target prod|staging` selects the backend at run time. Assets:
# wego-darwin-arm64, wego-darwin-x64, wego-linux-arm64, wego-linux-x64,
# wego-windows-x64.exe, each also gzipped, plus VERSION and SHA256SUMS.txt.
#
# Jobs: prepare, build, sign, leave-macos, integration, release, notify-verify,
# next-report, announce, replace-macos. `sign` and `notify-verify` are the only
# jobs with `id-token: write`, and they hold it for unrelated reasons: `sign`
# exchanges the token for a Fulcio certificate, `notify-verify` presents it as an
# identity to a receiver that writes a check run back. `release` is the only job
# with the store token, and neither of the two can reach it.
# `scripts/workflow-shape.test.ts` asserts this split and names the exact set.
#
# `notify-verify` IS ALLOWED TO GO RED. Nothing that publishes needs it, and a red
# there means "verification was not requested", never "the release failed". The
# bytes are published and `cli/next` has moved by the time it runs. It carries no
# `continue-on-error` on purpose: a request that silently did not happen is worse
# than a red job, because the promote banner would then show "No report" for a
# reason nobody saw. A red here makes the run's conclusion `failure`, so
# `promote-cli.yml` reads this run job by job and leaves out `notify-verify` and
# `next-report`: a receiver outage must not hold back a promote.
#
# `next-report` IS NEVER RED. It waits for wego-ai's `cli-next-smoke` check, looks
# once at its `cli-next-evals` check, and writes both into this run's summary, for
# a person to read before promoting. It is advice, so every outcome, including
# "no report", is a green job.
#
# Signing identity (the Fulcio SAN):
#   https://github.com/wego/cli/.github/workflows/release-cli.yml@refs/tags/vX.Y.Z
# The SAN names the workflow file. A composite action does not change it. A
# reusable workflow would change it and break every installed binary. Keep the
# signing step in this file.
#
# The GitHub Release is a human record. Distribution is the store, not Release
# assets. See docs/release.md.
on:
  push:
    tags:
      - 'v*'

# No workflow-level `concurrency:`. Only `release` moves a pointer, so only `release`
# has a group. A workflow-level group would hold a slot for the whole run, and
# GitHub keeps at most one pending run per group.

# Floor for the jobs without their own `permissions:` block. `prepare`, `build` and
# the macOS jobs only read. A job-level block replaces this one. `id-token` is
# granted on `sign` and `notify-verify` only; a workflow-level grant would reach
# every job.
permissions:
  contents: read

jobs:
  prepare:
    name: Gate and resolve CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      # The highest plain vX.Y.Z below this tag, or empty on the first release.
      # Used by the GitHub Release compare range.
      prev_tag: ${{ steps.resolve.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git push in this job. Do not keep the token in .git/config.
          persist-credentials: false
          # Full history: tags for prev_tag, and refs/remotes/origin/main for the
          # ancestry check.
          fetch-depth: 0
          # Every job checks out the commit that started the run.
          ref: ${{ github.sha }}

      # A tag can point at any commit. Require the commit to be an ancestor of main.
      # The check reads the local `refs/remotes/origin/main` from the checkout
      # above. This step holds no git credential, so it must not fetch.
      #
      # The branch arm is not reachable today; there is no other trigger. It stays
      # as a guard for a future trigger.
      - name: Refuse to release a non-main commit
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
              echo "::error::refs/remotes/origin/main is missing, so the on-main check cannot run. Restore 'fetch-depth: 0' on this job's actions/checkout (it is what fetches refs/remotes/origin/*) and re-run."
              exit 1; }
            git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
              echo "::error::Tag $REF is not merged to main - refusing to publish it."
              exit 1; }
            echo "ok: $REF points at a commit on main."
          else
            [ "$REF" = "refs/heads/main" ] || {
              echo "::error::Only main is releasable (got $REF)."
              exit 1; }
            echo "ok: $REF is main."
          fi

      - uses: ./.github/actions/setup-bun

      # Do not build from a red commit. The tag already exists when this runs. On a
      # failure, fix and re-run, or release the next version.
      - name: Lint & format check
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

      # The same audit, at tag time. Not redundant with `ci-cli`, which audits at merge
      # time: an advisory published between the last merge to `main` and this tag falls
      # in that gap, and this step is what closes it. `prepare` is the only correct job
      # for it - `build`, `sign` and `release` all `needs:` this one, so a finding here
      # means the vulnerable tree is never compiled, never signed and never published.
      - name: Audit the installed dependency tree (bun.lock)
        run: bun audit --audit-level=high

      # Read the tag from the ref. Nothing here computes a version.
      #
      # `validate-release-tag.ts` is the parser the binary uses, so the tag and the
      # baked version cannot disagree. A prerelease is refused: `next` and `stable`
      # serve plain X.Y.Z only, and `-edge.*` has its own lane.
      - name: Read the release tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            echo "::error::No release tag. This workflow releases a v* tag that already exists, pushed by release-please's App. There is no version to compute here and no other way to start it."
            exit 1
          fi
          bun run scripts/validate-release-tag.ts "$TAG"
          case "${TAG#v}" in
            *-*)
              echo "::error::$TAG is a prerelease. The -rc.N scheme is gone (#74 rung 7): this workflow publishes a plain X.Y.Z to cli/next, and the only prerelease line is cli/edge, published by edge-cli.yml on every merge to main. Release a plain version, or let the edge lane serve the unreleased build."
              exit 1 ;;
          esac
          # prev_tag: the highest plain vX.Y.Z below $TAG. $TAG is added to the
          # list so awk always finds it; without it a tag below every existing tag
          # would print the highest tag. Empty on the first release.
          PREV=$( { git tag -l 'v*' \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; \
                    echo "$TAG"; } \
                  | sort -V -u \
                  | awk -v t="$TAG" '$0==t{exit} {p=$0} END{print p}')
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prev_tag=$PREV"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG to cli/next (predecessor: ${PREV:-none})"

  # No `environment:`. This job must not reach the store token. One build, not a
  # matrix: the binary bakes the production endpoints and `--target` swaps them at
  # run time.
  build:
    name: Build CLI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Cross-compiles every target. `RELEASE_TAG` sets the baked version.
      - name: Build binaries
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WEGO_AUTH_AUTHORIZE_URL: ${{ vars.WEGO_AUTH_AUTHORIZE_URL }}
          WEGO_AUTH_TOKEN_URL: ${{ vars.WEGO_AUTH_TOKEN_URL }}
          WEGO_API_URL: ${{ vars.WEGO_API_URL }}
          WEGO_CLI_CLIENT_ID: ${{ vars.WEGO_CLI_CLIENT_ID }}
          # Not read by build-release.ts or release-config.ts. It has no effect.
          # Removal is tracked in wego/foundations#139.
          WEGO_CLI_SKILL_ORIGIN: ${{ vars.WEGO_CLI_SKILL_ORIGIN }}
          # Optional. An empty value makes the binary send no telemetry. A public
          # write-only key inside a public binary, so a variable, not a secret.
          # `release-config.ts` rejects a value that is not a `phc_` project key.
          WEGO_CLI_POSTHOG_PROJECT_KEY: ${{ vars.WEGO_CLI_POSTHOG_PROJECT_KEY }}
        run: bun run scripts/build-release.ts

      # Write VERSION before the manifest so the manifest lists it. VERSION is the
      # only version string in the ring; `src/version-notice.ts` reads it. Hashing
      # happens here so that `sign` does not need the binaries.
      - name: Checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          printf '%s\n' "$VERSION" > VERSION
          sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Two artifacts. `sign` downloads only the manifest. `release` downloads both
      # plus the signature.
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: dist/wego-*
          if-no-files-found: error
          # A handoff between jobs. `cli/<tag>/` is the durable copy.
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-checksums
          path: |
            dist/VERSION
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # The only job that can sign. It installs no project dependencies: no Bun, no
  # `node_modules`. Every step of a job with `id-token: write` can get a Fulcio
  # certificate, so every action it runs is pinned by commit SHA: the checkout and
  # artifact actions here, and `cosign-installer` inside `sign-manifest`, which is
  # loaded from the checked-out revision. No `environment:`, so no store token.
  sign:
    name: Sign the release manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Keyless signing. cosign exchanges this token for a short-lived certificate
      # that names this workflow on this tag. The installer and `wego update` pin
      # that name. There is no signing key to store or rotate.
      id-token: write
    steps:
      # Checkout only to provide `./.github/actions/sign-manifest`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      # Sign the manifest, not each asset. The manifest names every file by sha256,
      # so one record covers the release. `release` publishes the bundle to the
      # separate `cli-sig/<tag>/` prefix.
      - uses: ./.github/actions/sign-manifest

      - name: Upload the signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-signature
          path: dist/SHA256SUMS.txt.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # The pre-publication checks for darwin-arm64. `release` needs this job, so a
  # macOS failure blocks publication. Needs `build`, not `sign`: the checks compare
  # bytes to the manifest, and `release` verifies the signature before publishing.
  # No `environment:` and no `id-token`.
  leave-macos:
    name: Prove this build can leave, on macOS
    needs: [prepare, build]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The checks run the production binary. Do not post CI runs as product usage.
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: dist

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      # One definition for both platforms: `.github/actions/verify-build`.
      - name: Verify this build before publishing (wego-darwin-arm64)
        uses: ./.github/actions/verify-build
        with:
          asset: wego-darwin-arm64
          version: ${{ needs.prepare.outputs.version }}

  # The integration suite (`integration/`) against every binary this release
  # built, each on a runner that can execute it. `release` needs this job, so a
  # target that fails blocks publication for all of them: `cli/next` serves one
  # manifest, and a release with a broken platform in it has no backward path.
  #
  # `leave-macos` and `release` prove that a build can update and be replaced;
  # this proves that the commands themselves work once compiled, on every target
  # and not only the two those jobs run on. It is hermetic: the fake API is a
  # `Bun.serve` on loopback, so nothing here reaches production or staging, and a
  # red is this build.
  #
  # `WEGO_INTEGRATION_BINARY` names the artifact `build` produced. Without it the
  # suite compiles a host binary of its own, which would test the tree, not the
  # bytes about to be published.
  #
  # `fail-fast: false`: one red target should not cancel the others, or the run
  # reports one failure where there may be three.
  #
  # darwin-x64 runs on `macos-15-intel`, GitHub's Intel label since `macos-13` was
  # retired. No `environment:` and no `id-token`.
  integration:
    name: integration (${{ matrix.target }})
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            asset: wego-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: wego-linux-arm64
          - target: darwin-arm64
            runner: macos-latest
            asset: wego-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            asset: wego-darwin-x64
          - target: windows-x64
            runner: windows-latest
            asset: wego-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: dist

      # The suite refuses to run a binary that does not match its manifest line
      # (`WEGO_INTEGRATION_MANIFEST`): verify-then-execute, on every target.
      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      # An artifact does not keep the executable bit. Windows has none to restore.
      - name: Make the binary executable
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: chmod +x "dist/$ASSET"

      # `github.workspace`, not `$PWD`: on Windows the step's bash reports a
      # `/d/a/...` path that Bun cannot open, and the runner's own path is one
      # every platform's Bun reads.
      - name: Integration tests (${{ matrix.asset }})
        shell: bash
        env:
          WEGO_INTEGRATION_BINARY: ${{ github.workspace }}/dist/${{ matrix.asset }}
          WEGO_INTEGRATION_MANIFEST: ${{ github.workspace }}/dist/SHA256SUMS.txt
        run: bun run test:integration

  # The only job that moves a ring.
  release:
    name: Publish CLI binaries to cli/next
    needs: [prepare, build, sign, leave-macos, integration]
    # One group: every release writes `cli/next`. Do not cancel a run in progress:
    # a cancel between the binaries and the manifest leaves the ring half-moved.
    concurrency:
      group: ring-next
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read by `replace-macos`. Both platforms skip SMOKE 3 together when the ring
    # holds no complete predecessor.
    outputs:
      store_origin: ${{ steps.publish.outputs.store_origin }}
      prev_usable: ${{ steps.prev_channel.outputs.usable }}
      prev_version: ${{ steps.prev_channel.outputs.prev_version }}
    # The store token lives here. Only this job enters the environment. `release`
    # admits `v*` tags only, so nothing but a release cut from a tag can read it -
    # the edge, promote and rollback lanes each have their own environment.
    #
    # Not cryptographic separation: the same `BLOB_READ_WRITE_TOKEN` value sits in
    # all four lane environments and still has write access to the whole store. The
    # split changes who can reach it and from which ref, not what it can do.
    environment:
      name: release
    # No `id-token`: signing happened in `sign`. This job can write bytes to the
    # store but cannot produce a record clients accept.
    #
    # `contents: read`, not write. This job used to hold the store token and
    # `contents: write` together, the only job in the repository with two meaningful
    # write capabilities. The GitHub Release moved to `announce`, which holds
    # `contents: write` and no environment. Do not give this job write back.
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Rebuild `dist/` from the three artifacts. `upload-release-blob.ts` publishes
      # the binaries, VERSION and the manifest to `cli/<tag>/` and the bundle to
      # `cli-sig/<tag>/`.
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: dist

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-signature
          path: dist

      # The binaries and the manifest arrived as separate artifacts. Check that they
      # agree before the first store write. After `--freeze` the version number is
      # spent, so a failure found later costs a new version.
      # One definition for both platforms: `.github/actions/verify-build`.
      - name: Verify this build before publishing (wego-linux-x64)
        uses: ./.github/actions/verify-build
        with:
          asset: wego-linux-x64
          version: ${{ needs.prepare.outputs.version }}

      # Write `cli/<tag>/` (allowOverwrite: false) and `cli-sig/<tag>/`. Does not
      # move `cli/next`. RELEASE_COMMIT: a re-run from a different commit is refused;
      # `bun build --compile` is not reproducible. REQUIRE_PUBLISH: a missing token
      # fails the run.
      - name: Publish immutable artifact (cli/<tag>)
        id: publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REQUIRE_PUBLISH: 'true'
          RELEASE_COMMIT: ${{ github.sha }}
        run: bun run scripts/upload-release-blob.ts --freeze "$TAG"

      # Hash-check every asset in `cli/<tag>/` before the pointer moves, not only the
      # runner-native one. A partial re-run could leave a non-Linux asset that does
      # not match the frozen sums.
      - name: Verify immutable artifact (all assets)
        if: steps.publish.outputs.store_origin != ''
        env:
          BASE: ${{ steps.publish.outputs.store_origin }}/cli/${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sh scripts/verify-published.sh "$BASE" "$VERSION" all

      # SMOKE 3's predecessor, read from `cli/next` before the pointer moves.
      #
      # Not read from `cli/<prev_tag>/`: the tag grammar changed at the handover.
      # wego-ai published `cli-vX.Y.Z`; this repository publishes `vX.Y.Z`. The
      # ring names whatever was last published, under either grammar.
      #
      # HTTP 404 means an empty or incomplete ring and skips SMOKE 3 on both
      # platforms. Any other error fails. The darwin asset is captured here too,
      # because `replace-macos` runs after the pointer moves.
      #
      # On a re-run after the pointer moved, the predecessor is this release, and
      # SMOKE 3 fails on `--require-replace`. That is intended. See "Advance
      # cli/next" below.
      - name: Capture the predecessor binary (for the update smoke)
        id: prev_channel
        if: steps.publish.outputs.store_origin != ''
        env:
          BASE: ${{ steps.publish.outputs.store_origin }}/cli/next
          ASSET: wego-linux-x64
          ASSET_MAC: wego-darwin-arm64
        run: |
          set -eu
          dir="${RUNNER_TEMP}/prev-channel"
          mkdir -p "$dir"
          usable=1
          missing=""
          for obj in "$ASSET" "$ASSET_MAC" SHA256SUMS.txt VERSION; do
            code=$(curl -sSL --connect-timeout 15 --max-time 600 \
                     -w '%{http_code}' -o "$dir/$obj" "$BASE/$obj") \
              || { echo "::error::transport failure fetching $BASE/$obj (curl exit $?)." >&2; exit 1; }
            case "$code" in
              200) ;;
              404) usable=0; missing="$obj"; break ;;
              *) echo "::error::unexpected HTTP $code for $BASE/$obj." >&2; exit 1 ;;
            esac
          done
          if [ "$usable" = 0 ]; then
            # Remove the partial directory so a 404 body cannot pass as a binary.
            rm -rf "$dir"
            echo "::notice::cli/next is not serving a complete release ($missing returned 404) - SMOKE 3 skipped on BOTH platforms. This release is unaffected."
            echo "SMOKE 3 skipped: cli/next has no $missing, nothing to update from." >> "$GITHUB_STEP_SUMMARY"
          else
            prev_version=$(tr -d '\r\n' < "$dir/VERSION")
            echo "predecessor $prev_version from cli/next" >> "$GITHUB_STEP_SUMMARY"
            echo "predecessor $prev_version from cli/next (verified before execution below)."
            echo "prev_version=$prev_version" >> "$GITHUB_OUTPUT"
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"

      # `replace-macos` runs on another runner, after the pointer moves. Upload the
      # darwin predecessor now, before the commit point, so a failure here leaves
      # `cli/next` unchanged and a re-run is clean. The linux predecessor stays on
      # this runner.
      - name: Hand the darwin predecessor to the macOS leg
        if: steps.publish.outputs.store_origin != '' && steps.prev_channel.outputs.usable == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-predecessor
          path: |
            ${{ runner.temp }}/prev-channel/wego-darwin-arm64
            ${{ runner.temp }}/prev-channel/SHA256SUMS.txt
            ${{ runner.temp }}/prev-channel/VERSION
          if-no-files-found: error
          retention-days: 1

      # THE COMMIT POINT. Server-side copy of the verified `cli/<tag>/` bytes to
      # `cli/next`. `cli/stable` and `cli/edge` are not touched.
      #
      # A published binary cannot be recalled. `cli/next` has no backward path: no
      # workflow moves it to an older tag. The remedy for a bad release is the next
      # release. `cli/stable` has `rollback-cli.yml`.
      #
      # The copy is not atomic. Order: binaries, signed record, SHA256SUMS.txt (the
      # commit point), consistency wait, VERSION. Every copy has allowOverwrite:
      # true, so a re-run is idempotent. If this step fails:
      #   before any copy     cli/next unchanged. Re-run: clean.
      #   during the copy     cli/next serves new binaries under the old manifest.
      #                       Clients refuse (fail-closed). Re-run: repairs the
      #                       ring, then fails at the predecessor check.
      #   after the manifest  Ring correct; VERSION old. Re-run: fails at SMOKE 3.
      # Re-run once. Green means the first case. Red means the ring is consistent
      # and the remedy is a new version.
      #
      # Runs before SMOKE 3, which downloads from `cli/next`.
      - name: Advance cli/next
        if: steps.publish.outputs.store_origin != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: 'true'
          TAG: ${{ needs.prepare.outputs.tag }}
          TO: next
        run: bun run scripts/upload-release-blob.ts --promote "$TAG" --to "$TO"

      # Native asset only. The pointer is a copy of the prefix verified above.
      - name: Verify cli/next
        if: steps.publish.outputs.store_origin != ''
        env:
          BASE: ${{ steps.publish.outputs.store_origin }}/cli/next
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sh scripts/verify-published.sh "$BASE" "$VERSION" native

      # SMOKE 3, 4, 5, the 1.1.0 hop and SMOKE 6 for linux-x64. One definition for
      # both platforms: `.github/actions/verify-replace`.
      #
      # The 1.1.0 hop runs here, days before the promote asks the same question.
      # 1.0.1 is not driven here: it trusts only wego-ai's identity and cannot reach
      # ring `next`. `promote-cli.yml` covers it on `stable`.
      - name: Prove the replace path (linux-x64)
        if: steps.publish.outputs.store_origin != ''
        uses: ./.github/actions/verify-replace
        with:
          asset: wego-linux-x64
          version: ${{ needs.prepare.outputs.version }}
          predecessor-dir: ${{ runner.temp }}/prev-channel
          prev-usable: ${{ steps.prev_channel.outputs.usable }}
          store-origin: ${{ steps.publish.outputs.store_origin }}

      # No skill steps. The SKILL.md ships inside the binary.

  # Ask the private receiver to smoke this release against staging.
  #
  # Hosted runners cannot reach staging, so wego-ai runs the smoke, against the
  # bytes `cli/next` now serves. It writes the answer back as a `cli-next-smoke`
  # check run on this commit, as its GitHub App (id 4987365), and `next-report`
  # below reads it into this run's summary. Nothing gates on it.
  #
  # THIS REPOSITORY HOLDS NO CREDENTIAL FOR ANY OF IT. What travels is a GitHub
  # Actions OIDC token, which GitHub signs and this job merely asks for; the
  # receiver decides what it is worth by reading the claims. The identity it admits
  # for this lane is: `repository == wego/cli`, `event_name == push`,
  # `ref == refs/tags/<tag>`, `sha == body.sha`, and a `job_workflow_ref` naming
  # THIS file at THIS tag. A fork, a branch run, or a call from another workflow
  # produces a token that does not match, and the receiver answers 403.
  #
  # NO SWITCH ON THIS SIDE. The job always asks; the receiver's own switch, in
  # wego-ai, decides. Switched off, it answers 404, read below as "not verified".
  #
  # `needs: [prepare, release]` is the whole dependency set, and `release` is on it
  # because the smoke is of what `cli/next` now serves. That is also the only edge
  # to a job holding the store token, and this job cannot reach the token through
  # it: `needs` passes outputs, not secrets, and this job declares no
  # `environment:`, which is where the token lives.
  notify-verify:
    name: Request release verification
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The receiver's answer, for `next-report`: the HTTP code, or `error` when the
    # request never got one. Written first as `error` so a step that dies before
    # the answer still leaves a value to read; a later write of the same key wins.
    outputs:
      status: ${{ steps.ask.outputs.status }}
    # NO `environment:`, ever. This job holds `id-token: write`, so every step of it
    # can mint a token under an identity a receiver trusts; an environment here
    # would put the store token in the same job, which is the pairing
    # `workflow-shape.test.ts` exists to refuse.
    #
    # `id-token: write` alone. No `contents: read` either: there is no checkout,
    # and a job-level block replaces the workflow floor rather than adding to it.
    permissions:
      id-token: write
    steps:
      # No checkout: nothing in the tree is read, so there is no repository code
      # beside the OIDC token. Same reasoning as `sign`.
      #
      # Everything the receiver is told arrives through `env:`, never interpolated
      # into the script. The tag comes from `prepare`, which parsed it from the ref,
      # and the sha is the commit that started this run, the same one the check run
      # will be written onto.
      - name: Present this run's identity and ask for verification
        id: ask
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ github.sha }}
          # A literal, not a variable: one production receiver, and a setting here
          # would be a second switch beside the receiver's own. Under `/.well-known/`
          # because that prefix on this host is served by the API.
          RECEIVER: https://api.wego.com/.well-known/internal/cli-verify
        run: |
          set -euo pipefail
          echo "status=error" >> "$GITHUB_OUTPUT"
          JWT=$(curl -sS --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=wego-cli-verify" | jq -r .value)
          echo "::add-mask::$JWT"
          # The status is read rather than left to `--fail-with-body`, because 409 is
          # not a failure here. The receiver spends the token's `jti` for 15 minutes,
          # so a `--retry` after a LOST RESPONSE replays a request it already
          # dispatched and is answered 409. Failing on that would report "verification
          # not requested" for a verification that was requested and is running.
          #
          # `--retry` retries a connection error, a timeout, and an HTTP 408, 429 or
          # 5xx answer, reusing the same JWT and so the same `jti`. That is safe
          # because the receiver spends the `jti` only once the dispatch succeeded: a
          # 5xx left it unspent, so the retry is a fresh attempt, and a 409 still
          # means a first attempt dispatched and its answer was lost.
          #
          # Minting a fresh token per attempt would remove the 409 entirely and make
          # one worth failing on. Not done: it buys a distinction nobody acts on, and
          # the receiver's guard is the thing keeping a replay from dispatching twice.
          #
          # `jq -c` prints exactly `{"tag":"vX.Y.Z","sha":"<40 hex>"}`, and `--arg`
          # makes both values jq data rather than jq program text.
          BODY="$RUNNER_TEMP/cli-verify.out"
          CODE=$(curl -sS --retry 3 -o "$BODY" -w '%{http_code}' -X POST "$RECEIVER" \
            -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg tag "$TAG" --arg sha "$SHA" '{tag:$tag, sha:$sha}')")
          echo "status=$CODE" >> "$GITHUB_OUTPUT"
          # Bounded: this is another system's body landing in a PUBLIC log.
          head -c 500 "$BODY"; echo
          case "$CODE" in
            202) echo "::notice::verification started for $TAG (202). next-report shows the result in this run's summary." ;;
            409) echo "::notice::verification had already started for $TAG (409). A retry replayed a token the receiver had spent, so the first attempt dispatched and the smoke is running." ;;
            # Switched off is a state, not a fault: a notice, so it reads as
            # "not verified" without a red release.
            404) echo "::notice::the receiver is switched off (404), so $TAG was not verified. Re-run this job once it is on." ;;
            *)   echo "::error::the receiver refused the request for $TAG (HTTP $CODE). $TAG is published and cli/next has moved. promote-cli.yml does not wait on this job, so $TAG can still be promoted. Re-run this job once the reason above is fixed to get its report."
                 exit 1 ;;
          esac

  # wego-ai's answer, in this run's summary: the smoke's verdict, a link to the
  # private run, one row per part beside the previous release, and one line on the
  # skill evals. Rendered by `scripts/next-report.ts`, which reads only the
  # `cli-next-smoke` and `cli-next-evals` checks written by wego-ai's App (id
  # 4987365) and ignores those names from anyone else. It waits for the smoke
  # only; the evals can take hours, and the promote banner shows them.
  #
  # Runs whenever `notify-verify` ran, red included, because the report says why
  # there is none: a 404 and a refusal are written at once, with no wait. Skipped
  # when `notify-verify` was, which is every run that did not publish. After a
  # 202 or 409 it looks every 30 s, for up to 45 min.
  #
  # NEVER RED, three ways over: the script exits 0 on every state it knows, the
  # step turns a crash into a summary line and `exit 0`, and the job is
  # `continue-on-error`. Nothing needs it. A red here would read as a failed
  # release and send someone looking for a fault in the bytes.
  #
  # `checks: read` for the API read and `contents: read` for the checkout, and
  # nothing else: no environment, no secret, no `id-token`. `github.token` is the
  # run's own token, scoped to those two grants.
  next-report:
    name: next report
    needs: [prepare, notify-verify]
    if: ${{ !cancelled() && (needs.notify-verify.result == 'success' || needs.notify-verify.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Wait for wego-ai's report and show it
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ github.sha }}
          NOTIFY_STATUS: ${{ needs.notify-verify.outputs.status }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run scripts/next-report.ts
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "● No report: next-report exited $code" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::next-report exited $code before writing a report."
          fi
          exit 0

  # The GitHub Release, split out of `release` so no job holds both the store token
  # and repository write.
  #
  #   release    environment: release   (store token)   contents: read
  #   announce   no environment         (no token)      contents: write
  #
  # One job used to hold both. A compromised transitive dependency executing there
  # got repository write and the ring together. There is nothing in this job to
  # compromise either: one `github-script` step and an artifact download, no Bun, no
  # `node_modules`, no `@vercel/blob`.
  #
  # No `environment:`, and it must stay that way. Do not hoist `environment:` to
  # workflow level in this file: that would give this job the store token and give
  # `sign` one too, collapsing the separation between signing and writing the ring.
  # Nothing would visibly break.
  #
  # `needs: [prepare, release]`: `prepare` produces `tag` and `prev_tag`, and the
  # bytes must be published before a Release announces them. Same order as when
  # these steps sat at the end of `release`.
  #
  # `promote-cli.yml` gates on the release run's conclusion, not on one job, so a
  # failure here holds the tag back from promote until it is re-run. This job is
  # idempotent and writes no ring, so re-running it alone is safe.
  announce:
    name: Announce the release on GitHub
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: write` is for the Release step and is the only write grant here. No
    # `id-token`: signing belongs to `sign`.
    permissions:
      contents: write
    steps:
      # Only SHA256SUMS.txt is needed; the binaries went to the store in `release`.
      # `cli-checksums` has `retention-days: 1`, which this job is inside: it starts
      # as soon as `release` finishes.
      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      # The human record. Idempotent: a release that already has SHA256SUMS.txt is
      # skipped; one without it gets the asset attached; a missing release is
      # created. release-please normally creates the release, so the create branch
      # is a fallback. Notes span prev_tag to this tag.
      - name: GitHub Release (changelog + record)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
        with:
          script: |
            const fs = require("node:fs");
            const tag = process.env.TAG;
            // Always a plain X.Y.Z: `prepare` refuses a prerelease.
            const prerelease = false;
            const { owner, repo } = context.repo;

            // Notes from prev_tag to this tag. prev_tag is computed once, in
            // `prepare`. Every PR in this repository is a CLI PR, so no path filter.
            const anchoredNotes = async () => {
              const previous_tag_name = process.env.PREV_TAG || undefined;
              const { data: gen } = await github.rest.repos.generateReleaseNotes({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                ...(previous_tag_name ? { previous_tag_name } : {}),
              });
              return gen.body;
            };

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = data;
              if (release.assets.some((a) => a.name === "SHA256SUMS.txt")) {
                core.info(`Release ${tag} already complete — skipping.`);
                return;
              }
              core.info(`Release ${tag} exists but missing SHA256SUMS.txt — attaching.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              const rel = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: tag,
                prerelease,
                make_latest: prerelease ? "false" : "true",
                body: await anchoredNotes(),
              });
              release = rel.data;
            }
            // github-script runs at the workspace root.
            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id: release.id,
              name: "SHA256SUMS.txt",
              data: fs.readFileSync("dist/SHA256SUMS.txt"),
            });
            core.info(`Release ${tag} ready (SHA256SUMS.txt attached).`);

  # The post-pointer checks for darwin-arm64: SMOKE 3, 4, 5, the 1.1.0 hop and
  # SMOKE 6. This job exists because `src/update.ts` has a darwin-only branch
  # (`clearQuarantine`) that no Linux runner executes.
  #
  # Runs after `release` because the checks download from `cli/next`. A failure
  # here means macOS installs may not update off this build; the remedy is a new
  # version. This job writes nothing, so a re-run of this job alone is safe.
  # `promote-cli.yml` requires a successful run of this workflow.
  #
  # One job, not one per check: the runner boot, checkout and install dominate the
  # cost; each check takes seconds. No `environment:` and no `id-token`.
  # `macos-latest` is Apple silicon. darwin-x64, linux-arm64 and Windows are not
  # replace-tested; `integration` runs the commands on all five before publication.
  replace-macos:
    name: Prove the replace path on macOS
    needs: [prepare, release]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # The signature bundle is not needed here. The checks compare bytes to the
      # manifest, and the manifest's signature was verified before publication.
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: dist

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-checksums
          path: dist

      # Captured by `release` before the pointer moved. Same `usable` gate as the
      # linux leg: both platforms skip SMOKE 3 together.
      - name: Download the darwin predecessor
        if: needs.release.outputs.prev_usable == '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-predecessor
          path: ${{ runner.temp }}/prev-channel

      # Same guard as the linux leg. If nothing was published, no ring serves this
      # build.
      - name: Prove the replace path (darwin-arm64)
        if: needs.release.outputs.store_origin != ''
        uses: ./.github/actions/verify-replace
        with:
          asset: wego-darwin-arm64
          version: ${{ needs.prepare.outputs.version }}
          predecessor-dir: ${{ runner.temp }}/prev-channel
          prev-usable: ${{ needs.release.outputs.prev_usable }}
          store-origin: ${{ needs.release.outputs.store_origin }}
