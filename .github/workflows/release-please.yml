name: release-please

# release-please owns the version. No person types a version in this repository.
#
# On every push to main this workflow keeps one release PR open. The PR carries the
# next version, computed from the conventional-commit subjects since the last tag,
# and updates `package.json` and `.release-please-manifest.json`.
#
# Merging that PR is the release. release-please then creates the `vX.Y.Z` tag and
# the GitHub Release. The tag push starts `release-cli.yml`. That workflow has no
# `workflow_call` and no `workflow_dispatch`, so the tag is the only way in.
#
# The tag must be pushed with an App token. A tag created with the workflow token
# does not start a workflow (GitHub recursion guard).
#
# `release-type: node` writes `package.json`. bun does not record the root package
# version in `bun.lock`, so the version bump keeps `--frozen-lockfile` green.
on:
  push:
    branches:
      - main

# Scopes of the workflow token. The release-please action uses the App token for
# the tag and the PR, so the App's own installation permissions are what count.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The App key lives in an environment bound to `main`. A repository-scope secret
    # is readable by the workflow file of any branch, including a pull request.
    environment: release-please
    # One release PR at a time. Do not cancel: a cancelled run can leave the PR
    # half-updated.
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      # A short-lived installation token, scoped to this repository. Not a PAT.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # The tag is pushed as the App, so it starts `release-cli.yml`. With
      # `github.token` the tag would start nothing.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please can merge a release PR, create no tag, and exit 0. Then
      # `release-cli.yml` never starts and nothing is published. It also opens no
      # new release PR until the wedge clears. Observed in wego/foundations#129.
      #
      # The signal is the label. release-please sets `autorelease: pending` when it
      # opens the PR and changes it to `autorelease: tagged` when it creates the
      # release. A merged PR that still carries `pending` means the release did not
      # complete. This check does not depend on the cause.
      #
      # `pulls.list`, not the search API: search is eventually consistent and this
      # runs seconds after the label is written.
      - name: Refuse to exit green on a release that did not happen
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PENDING = "autorelease: pending";
            // Most recently updated first. A wedged PR was just merged, so it is
            // near the top.
            const { data: closed } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            const wedged = closed.filter(
              (pr) => pr.merged_at && pr.labels.some((l) => l.name === PENDING),
            );
            if (wedged.length > 0) {
              const list = wedged.map((pr) => `#${pr.number} '${pr.title}'`).join(", ");
              core.setFailed(
                `${wedged.length} merged release pull request(s) still labelled "${PENDING}": ${list}. ` +
                  `release-please merged a release but did not tag it, so release-cli.yml never ran and nothing was published. ` +
                  `Until this clears, release-please will also refuse to open any new release pull request. ` +
                  `Check the release-please step above for "does not match configured component" or a similar early return, fix the cause, ` +
                  `then re-drive the release - see wego/foundations#129 for the 2026-09-11 instance and its recovery.`,
              );
              return;
            }
            core.info(`ok: no merged release pull request is still "${PENDING}".`);
