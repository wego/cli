name: upgrade-paths-watch

# THE INSTALL BASE, WATCHED ON A CLOCK RATHER THAN ON A COMMIT.
#
# `release-cli.yml` and `promote-cli.yml` walk these chains at the two moments a
# CHANGE can break them: before a tag ships, and as `cli/stable` moves.
#
# This lane asks the half no commit triggers: can the people who are already out
# there still get here TODAY, on a day nobody released anything. The route a 1.0.x
# machine takes is mostly not ours -
#
#   - `apps/api` owns the legacy bridge pin (wego/foundations#132) that decides a
#     pre-relay agent is served the frozen `cli/cli-v1.1.0/` prefix
#   - the Blob store owns whether that frozen prefix, and the wego-ai-signed
#     record beside it, still exist
#   - Fulcio's roots and the certificates in both records own whether the
#     signatures still verify
#
# - so every one of them can break with no change here at all, and the failure is
# SILENT: a stranded install prints its refusal on one person's laptop. Nothing
# reaches us. A daily walk of the real chains is the only thing that does.
#
# WHAT A FAILURE HERE MEANS: not that a release is bad, but that some fraction of
# the install base can no longer update and does not know it. Treat it as an
# incident on the deploy or the store, not as a CLI bug: if the last promote's
# `Verify the install base can reach this promote` was green and this lane is now
# red with no release in between, the break is outside this repository.
on:
  schedule:
    # Daily, deliberately off the hour: GitHub queues scheduled runs hardest at
    # :00 and a delayed start is of no consequence here.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: upgrade-paths-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `environment:`, no store token. Every byte below is fetched over the
    # same public route a user's machine uses; a credential here would let the
    # gate reach something a consumer cannot, and pass on it.
    permissions:
      contents: read
    strategy:
      # Each path reported separately: "1.0.x is stranded" and "1.1.0 is
      # stranded" have different causes and different blast radii, and a shared
      # job would hide the second behind the first.
      fail-fast: false
      matrix:
        include:
          # THE TWO-HOP PATH. A pre-relay install cannot reach the current
          # release directly - the pin hands it the frozen 1.1.0 first - so the
          # route is asserted, not just the destination. `--via 1.1.0` is what
          # makes a silently-unpinned 1.0.x install a failure rather than a pass
          # that happens to converge somewhere else.
          - label: 1.0.1 (pre-relay) reaches stable
            tag: cli-v1.0.1
            via: '--via 1.1.0'
            max_hops: '2'
          # THE RELAY RELEASE. One hop, no pin: 1.1.0 trusts `wego/cli`'s
          # identities and reads the live pointer directly. This is the path
          # every 1.0.x install lands on halfway, so it carries both.
          - label: 1.1.0 (relay) reaches stable
            tag: cli-v1.1.0
            via: ''
            max_hops: '1'
    env:
      WEGO_CLI_TELEMETRY: "0"
      INSTALL_URL: https://api.wego.com/install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHERE THE STORE IS, asked of the deploy rather than hardcoded. The
      # `?dl=` route answers with a redirect to the object, so its `Location`
      # minus the well-known suffix IS the origin - which keeps this lane
      # host-agnostic like the rest of the release tooling, and means a deploy
      # repointed at a different store is followed rather than missed.
      - name: Resolve the store and what stable serves
        id: target
        run: |
          set -euo pipefail
          loc=$(curl -sI "$INSTALL_URL?dl=SHA256SUMS.txt&ring=stable" \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/stable/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect: '$loc'"
            exit 1
          fi
          version=$(curl -fsSL "$INSTALL_URL?dl=VERSION&ring=stable")
          if [ -z "$version" ]; then
            echo "::error::ring stable served no VERSION - the pointer is incomplete and every install following it fails closed."
            exit 1
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "store=$origin, stable serves $version"

      # The destination is read from the SAME pointer the chain follows, and that
      # is on purpose: the question is whether an old install CONVERGES on what
      # stable is serving, not whether stable is serving the right thing. The
      # release and promote lanes own the latter. Conflating them would make this
      # lane fail on every legitimate release for the hours before it notices.
      - name: Walk the path
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ matrix.tag }}
          VIA: ${{ matrix.via }}
          MAX_HOPS: ${{ matrix.max_hops }}
        run: |
          set -euo pipefail
          # $VIA is a controlled matrix literal ('' or '--via 1.1.0'), so word
          # splitting here is the intent rather than an accident.
          # shellcheck disable=SC2086
          sh scripts/upgrade-path.sh \
            "$ORIGIN/cli/$TAG/wego-linux-x64" stable "$VERSION" \
            --max-hops "$MAX_HOPS" $VIA
