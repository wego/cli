name: edge-cli

# The edge ring. Each push to main that changes the CLI builds the `wego-*`
# binaries, publishes them as `X.Y.Z-edge.<sha>` to the immutable `cli/<version>/`
# prefix, and moves `cli/edge` to that version.
#
# This workflow never creates a tag and never moves `cli/next` or `cli/stable`. It
# runs after the merge and is not a required check, so a red edge build blocks
# nothing.
#
# Three jobs. `build` makes the binaries. `sign` signs the manifest. `publish` writes
# the store. No job holds both the signing token and the store token. No job holds
# both the signing token and third-party code. `scripts/workflow-shape.test.ts`
# asserts this.
#
# Signing identity (the Fulcio SAN):
#   https://github.com/wego/cli/.github/workflows/edge-cli.yml@refs/heads/main
# This is `CLI_EDGE_SIGNING_IDENTITY` in `src/release-signing/identity.ts`, and
# `identitiesForRing("edge")` accepts it. The SAN names the workflow file. A
# composite action does not change it. A reusable workflow would change it and
# break `wego update` on edge. Keep the signing step in this file.
on:
  push:
    branches:
      - main
    # Build only when a file that changes the binary changes. `cli/edge` therefore
    # names the last commit that changed the CLI, not the last commit on main.
    #
    # A path filter is safe here because this workflow is not a required check. Do
    # not add one to `ci-cli.yml`.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'plugin/**'
      - 'skills/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.jsonc'
      - '.github/actions/setup-bun/**'
      - '.github/actions/sign-manifest/**'
      - '.github/workflows/edge-cli.yml'
  workflow_dispatch:

# No workflow-level `concurrency:`. Only `publish` moves the pointer, so only
# `publish` has a group. Do not cancel a run in progress: the pointer move is a
# multi-object copy, and a cancel can leave a manifest and binaries that do not
# agree. Clients then refuse the ring until the next publish.
#
# No `id-token` here. A workflow-level grant reaches every job. Only `sign` gets it.
permissions:
  contents: read

jobs:
  build:
    name: Build edge binaries
    # `workflow_dispatch` is for a re-run on main only. A dispatch on another branch
    # must not move `cli/edge`. `sign` and `publish` need this job, so one guard
    # covers all three jobs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `environment:`. This job must not read `BLOB_READ_WRITE_TOKEN`. The four
    # `WEGO_*` variables exist at repository level with the same values.
    #
    # `WEGO_CLI_POSTHOG_PROJECT_KEY` is intentionally not set. An empty key makes the
    # binary send no telemetry. Edge installs are dogfood, not product usage.
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Version = <package.json version>-edge.<short sha>.
      #
      # The base comes from `package.json`, not from `git tag`. On a release-PR merge
      # this workflow and `release-please.yml` run at the same time, and the tag can
      # be one release behind when this step reads it (wego/foundations#129).
      # release-please writes the new version into the release PR, so `package.json`
      # is correct at merge time. `ring-rules.ts` requires the `-edge.<id>` shape.
      - name: Resolve edge version
        id: version
        run: |
          set -euo pipefail
          base=$(jq -r '.version // empty' package.json)
          printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::package.json version '$base' is not a plain X.Y.Z. The edge lane bakes <base>-edge.<sha> and ring-rules.ts pins that shape, so a prerelease or missing version here would publish an object no ring can serve."
            exit 1
          }
          sha=$(git rev-parse --short HEAD)
          version="${base}-edge.${sha}"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      # One build for every platform. `RELEASE_TAG` sets the baked version.
      - name: Build edge binaries
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          WEGO_AUTH_AUTHORIZE_URL: ${{ vars.WEGO_AUTH_AUTHORIZE_URL }}
          WEGO_AUTH_TOKEN_URL: ${{ vars.WEGO_AUTH_TOKEN_URL }}
          WEGO_API_URL: ${{ vars.WEGO_API_URL }}
          WEGO_CLI_CLIENT_ID: ${{ vars.WEGO_CLI_CLIENT_ID }}
        run: bun run scripts/build-release.ts

      # Write VERSION before the manifest so the manifest lists it. Hashing happens
      # here so that `sign` does not need the binaries.
      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          printf '%s\n' "$VERSION" > VERSION
          sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Two artifacts. `sign` downloads only the manifest. `publish` downloads both
      # plus the signature. `publish-edge-blob.ts` accepts only `wego-*`,
      # SHA256SUMS.txt, VERSION and the signature bundle in `dist/`.
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-binaries
          path: dist/wego-*
          if-no-files-found: error
          # A handoff between jobs. The immutable prefix is the durable copy.
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-checksums
          path: |
            dist/VERSION
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # The only job that can sign. It installs nothing: no Bun, no `node_modules`.
  # Every step of a job with `id-token: write` can get a Fulcio certificate, so no
  # third-party code runs here. No `environment:`, so no store token.
  sign:
    name: Sign the edge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Keyless signing. cosign exchanges this token for a short-lived certificate
      # that names this workflow. That name is what `wego update` pins for edge.
      id-token: write
    steps:
      # Checkout only to provide `./.github/actions/sign-manifest`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-checksums
          path: dist

      # One signing definition, shared with `release-cli.yml`. An unsigned edge ring
      # would break `wego update` for every edge install.
      - uses: ./.github/actions/sign-manifest

      - name: Upload the signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-signature
          path: dist/SHA256SUMS.txt.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # The only job with the store token. No `id-token`, so nothing here can sign.
  publish:
    name: Publish edge and advance cli/edge
    needs: [build, sign]
    # One group per ring. Shared with any lane that moves the same pointer.
    concurrency:
      group: ring-edge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Rebuild `dist/` from the three artifacts.
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-binaries
          path: dist

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-checksums
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-signature
          path: dist

      # The binaries and the manifest arrived as separate artifacts. Check that they
      # agree before the first store write. `-c` also fails on a file the manifest
      # lists but the download did not deliver.
      - name: Re-verify the reassembled binaries against the signed manifest
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt

      # Publish `cli/<version>/` (immutable), then move `cli/edge`. The script
      # verifies the signed record against `identitiesForRing("edge")` and refuses on
      # a mismatch.
      #
      # RELEASE_COMMIT binds a re-run to the commit that first published this
      # version; `bun build --compile` is not reproducible. REQUIRE_PUBLISH makes a
      # missing token a failure, not a skip.
      - name: Publish edge and advance cli/edge
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: "true"
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bun run scripts/publish-edge-blob.ts "$VERSION"
