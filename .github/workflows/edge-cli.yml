name: edge-cli

# The edge lane. Every merge to `main` builds the `wego` CLI, publishes it as an
# `X.Y.Z-edge.<sha>` build, and advances the `cli/edge` moving pointer - so
# unreleased main is PUBLISHED and fetchable without touching the release path.
#
# Deliberately SEPARATE from `release-cli.yml`:
#   - it never cuts a tag and never advances `cli/next` or `cli/stable`; it only
#     moves `cli/edge`;
#   - "a broken edge build blocks nothing": it runs post-merge, so it can never
#     gate a pull request, and it is not a required status check.
#
# EXPECTED TO BE RED ON THE FIRST MERGE INTO THIS REPOSITORY, at the identity
# gate, and that red run is the input to wego/foundations#128's follow-up (1b).
# `publish-edge-blob.ts` verifies the record it just signed against
# `identitiesForRing("edge")`, and `src/release-signing/identity.ts` still names
# wego-ai's workflow:
#   https://github.com/wego/wego-ai/.github/workflows/edge-cli.yml@refs/heads/main
# cosign here asserts `wego/cli`'s, so the verify fails - correctly, and
# fail-closed. The wego/cli identities are added in 1b from the real certificate
# records that run produces, never typed by hand.
#
# THREE JOBS, AND THE SPLIT IS THE POINT (see `sign` below). `build` makes the
# bytes, `sign` vouches for them, `publish` writes them to the store. No job holds
# both the signing identity and third-party code, and no job holds both the
# signing identity and the store token.
on:
  push:
    branches:
      - main
    # Without this list every merge to `main` would rebuild, sign and republish a
    # CLI whose sources had not changed, writing about ten immutable objects into
    # the store each time. In wego-ai this list named `apps/cli/**` and the shared
    # root config; here it names the same things at the repository root.
    #
    # A TRIGGER filter is safe HERE and is not safe on `ci-cli.yml`: a
    # path-skipped workflow never reports its checks, and a required check that
    # never reports leaves the pull request unmergeable forever. This lane is
    # deliberately not a required check, so it has nothing to report.
    #
    # Consequence worth knowing: `cli/edge` stops advancing on a merge that
    # touches nothing it builds, so its recorded sha is the last sha that CHANGED
    # the CLI, not the last sha on main. That is the correct answer - the bytes
    # would have been identical.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'plugin/**'
      - 'skills/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.jsonc'
      - '.github/actions/setup-bun/**'
      - '.github/actions/sign-manifest/**'
      - '.github/workflows/edge-cli.yml'
  workflow_dispatch:

# NO workflow-level `concurrency:`, and no `cancel-in-progress` anywhere.
# Serialization belongs on the ONE job that advances a channel - `publish` below -
# and a cancel must never reach it: `cli/edge` is advanced as a NON-ATOMIC
# multi-object copy (binaries, then the manifest, then VERSION, with a consistency
# barrier between). Cancelling that part-way leaves the pointer holding a manifest
# and bytes that disagree, and every consumer cross-checks the two - so a cancelled
# advance is not a skipped build, it is an edge channel that fail-closed refuses
# every install and self-update until the next merge republishes it.
#
# Serialized-and-not-cancellable is also what keeps the pointer on the tip:
# GitHub holds at most ONE pending run per group and a newer merge replaces that
# pending run, so the newest merge still wins - it just waits for the in-flight
# publish rather than killing it.
#
# Scoping the group to `publish` also keeps `build` out of the queue: a run that
# never reaches the pointer never holds a slot for the ~15 minutes it spends
# cross-compiling.

# NO `id-token: write` HERE, and that is the whole change. It is declared on the
# `sign` job alone. A workflow-level grant reaches EVERY job in the file, and
# GitHub sets `ACTIONS_ID_TOKEN_REQUEST_URL` / `_TOKEN` for every step of a job
# that holds it - so any code running anywhere in this lane could mint its own
# Fulcio certificate naming this workflow, and clients pin the workflow name.
permissions:
  contents: read

jobs:
  build:
    name: Build edge binaries
    # `workflow_dispatch` above is for RE-RUNNING a failed edge publish on main,
    # never for publishing another ref: a dispatch can name any branch, and this
    # job would check it out, build it with the production values and move
    # `cli/edge` to it. That would put unmerged code in front of every edge
    # dogfooder, and the sha it advertises would not be an ancestor of main. So
    # the ref is gated here rather than the trigger removed.
    #
    # ONE guard, not three: `sign` and `publish` both `needs:` this job, and a
    # skipped dependency skips its dependents. Repeating the condition on each job
    # would be three copies of one rule to drift apart, which is the failure this
    # file has already paid for once (see `.github/actions/sign-manifest`).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NO `environment:`, deliberately - this job must not be able to reach the
    # store, exactly as the release lane's `build` job cannot. The four
    # `WEGO_*` values the build bakes are defined at REPO level as well as in the
    # `production` environment and the two sets are identical, so dropping the
    # environment here changes no baked byte; it only removes this job's ability to
    # read `BLOB_READ_WRITE_TOKEN`.
    #
    # NO `WEGO_CLI_POSTHOG_PROJECT_KEY` BELOW, and that omission is load-bearing:
    # `release-config.ts` treats the key as optional, so leaving it unset bakes an
    # empty key and `maybeSendTelemetry` returns "skipped-unbaked" - edge installs
    # are dogfood and must never count as product telemetry. Do NOT add it back to
    # make this lane match the release lane. Not passing it is the whole mechanism:
    # the variable is defined at REPO level, so it is visible to this job either
    # way and no environment scoping suppresses it.
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Never let any incidental binary run post CI activity as product telemetry.
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for `git rev-parse` below. The tag list is no longer read
          # here (the base comes from `package.json` - see `Resolve edge version`),
          # but this is the job that touches git at all, so the depth stays with it.
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Version = <base>-edge.<short sha of this merge>, base read from the TREE.
      # The base is cosmetic (the ring serves whatever the pointer names, and
      # `update` compares checksums, not versions); the `-edge.<sha>` shape is
      # what `ring-rules.ts` pins. `<sha>` is this merge commit, so it is always
      # an ancestor of `main`.
      #
      # THE BASE COMES FROM `package.json`, NOT FROM `git tag -l`, because the tag
      # list is racy here and the manifest is not. This lane and `release-please`
      # both trigger on a push to `main`. On a release-PR merge they run
      # CONCURRENTLY, and release-please creates the new tag as part of its run -
      # so this lane, checking out and listing tags first, sees the tag set from
      # BEFORE the release. Observed in wego/foundations#129: merge `1b37bd8`
      # carries `"version": "1.0.5"` and published `1.0.4-edge.1b37bd8`, because
      # `v1.0.5` did not exist yet when this step ran. Every release-PR merge
      # advertised the previous release's base.
      #
      # `package.json` has no such race: release-please writes the new version
      # INTO the release PR, so by the time that PR is merged the value is already
      # in the tree this step checks out. Verified across every release merge in
      # this repository - the manifest at each one equals the version that was
      # ultimately tagged.
      #
      # This also retires the `0.0.0` fallback and the `grep`/`pipefail` dance the
      # old tag pipeline needed: a package manifest always carries a version, and
      # a malformed one should stop the lane rather than silently bake garbage.
      - name: Resolve edge version
        id: version
        run: |
          set -euo pipefail
          base=$(jq -r '.version // empty' package.json)
          printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::package.json version '$base' is not a plain X.Y.Z. The edge lane bakes <base>-edge.<sha> and ring-rules.ts pins that shape, so a prerelease or missing version here would publish an object no ring can serve."
            exit 1
          }
          sha=$(git rev-parse --short HEAD)
          version="${base}-edge.${sha}"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      # One `wego-*` build for every platform (the edge ring serves that one
      # asset; the backend is chosen at run time by `--target`). RELEASE_TAG bakes
      # the version. No skill store origin is baked: the skill channel is not
      # present in this repository and the body ships embedded in the binary.
      - name: Build edge binaries
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          WEGO_AUTH_AUTHORIZE_URL: ${{ vars.WEGO_AUTH_AUTHORIZE_URL }}
          WEGO_AUTH_TOKEN_URL: ${{ vars.WEGO_AUTH_TOKEN_URL }}
          WEGO_API_URL: ${{ vars.WEGO_API_URL }}
          WEGO_CLI_CLIENT_ID: ${{ vars.WEGO_CLI_CLIENT_ID }}
        run: bun run scripts/build-release.ts

      # VERSION before the manifest, so it enters SHA256SUMS.txt with everything
      # else - the same shape `release-cli.yml` and `verify-published.sh` expect.
      #
      # Stays in THIS job, beside the bytes it measures: hashing is not a
      # privileged act, and computing the sums here means the signing job never
      # needs the 60-95 MB binaries at all - it receives the manifest and signs it.
      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          printf '%s\n' "$VERSION" > VERSION
          sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # TWO artifacts, not one, so that `sign` can take the manifest without the
      # binaries. `publish` reassembles the full `dist/` from both plus the
      # signature - and `publish-edge-blob.ts` refuses any file in `dist/` that is
      # not a `wego-*` binary, `SHA256SUMS.txt`, `VERSION` or the signature bundle,
      # so these paths are exactly the set it will accept.
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-binaries
          path: dist/wego-*
          if-no-files-found: error
          # A handoff between jobs of one run, not a kept artifact: the immutable
          # `cli/<version>/` prefix is the durable copy.
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-checksums
          path: |
            dist/VERSION
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # THE ONLY JOB IN THIS LANE THAT CAN SIGN.
  #
  # It installs nothing. `sign-manifest` needs cosign and a `dist/` holding
  # SHA256SUMS.txt, and nothing else - no Bun, no `node_modules`. So there is no
  # third-party code in this job to abuse the OIDC token, which is the whole
  # reason the job exists: `id-token: write` is granted per JOB, and every step of
  # a job that holds it can exchange it for a Fulcio certificate. Running
  # `bun install` beside the signing permission put 31 transitive packages - among
  # them `execa`, `cross-spawn` and `@vercel/oidc` - one import away from minting a
  # certificate that names this workflow, which is exactly the name clients pin.
  #
  # THE IDENTITY DOES NOT CHANGE by moving the signing step into another job. The
  # Fulcio SAN is the WORKFLOW ref -
  #   https://github.com/wego/cli/.github/workflows/edge-cli.yml@refs/heads/main
  # - not the job, so `identitiesForRing("edge")` and every installed binary keep
  # verifying exactly as before. A composite action (`sign-manifest`) runs inline
  # in the caller and does not change it either. A REUSABLE WORKFLOW WOULD: moving
  # this into a `workflow_call` file would re-point the SAN at that file and every
  # `wego update` on edge would fail-closed. Do not.
  sign:
    name: Sign the edge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment:` - this job must not be able to read the store token. The
    # pairing it exists to prevent is "can sign" plus "can write to the ring".
    permissions:
      contents: read
      # Keyless signing: cosign trades this token for a short-lived Fulcio
      # certificate naming THIS workflow, which is the identity `wego update` pins
      # for the edge ring. Distinct from `release-cli.yml`'s, so a dogfood record
      # can never pass as a release record.
      id-token: write
    steps:
      # Shallow: this checkout exists only to provide `./.github/actions/sign-manifest`.
      # Nothing here reads git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-checksums
          path: dist

      # Sign the manifest, exactly as the release lane does. The edge ring is
      # dogfood, but an unsigned one would be WORSE than pointless: a binary built
      # from this same main refuses a ring with no record, so skipping this would
      # break `wego update` for everyone on edge. ONE signing definition, shared
      # with the other publishing lane.
      - uses: ./.github/actions/sign-manifest

      - name: Upload the signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-signature
          path: dist/SHA256SUMS.txt.sigstore.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish edge and advance cli/edge
    needs: [build, sign]
    # The channel-advancing job, so the group lives here (see the file header).
    # One group per ring, shared with the lane that advances the same pointer.
    concurrency:
      group: ring-edge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Where the pointer this run advanced actually lives. `upgrade-paths` below
    # needs it to address the IMMUTABLE predecessor prefixes, and reading it from
    # the publish rather than hardcoding a host is what keeps this lane
    # host-agnostic like the rest of the release tooling.
    outputs:
      store_origin: ${{ steps.publish.outputs.store_origin }}
    # The store token lives here, and now ONLY here. This job cannot sign: with no
    # `id-token: write` GitHub sets no OIDC request variables for it at all, so a
    # compromised dependency in the publish path has nothing to exchange. It can
    # still write bytes to the store - but a record clients accept is out of
    # reach, and swapping a binary fails the manifest, which names every file by
    # sha256.
    environment:
      name: production
    permissions:
      contents: read
    env:
      # Never let any incidental binary run post CI activity as product telemetry.
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      # Reassemble `dist/` exactly as `publish-edge-blob.ts` expects it: the
      # `wego-*` binaries, SHA256SUMS.txt, VERSION, and the signature bundle. The
      # script refuses anything else in there, so these three downloads are the
      # whole contract between the jobs.
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-binaries
          path: dist

      - name: Download the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-checksums
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-signature
          path: dist

      # Publish cli/<version>/ (immutable) and advance cli/edge. This step holds
      # the identity gate the file header describes: the script verifies the
      # record it just wrote against `identitiesForRing("edge")` and refuses
      # fail-closed on a mismatch.
      #
      # RELEASE_COMMIT binds a resumed re-run to the commit that first published
      # this version: `bun build --compile` is not reproducible, so re-running a
      # partially-published prefix after main moved would mix bytes from two
      # builds. REQUIRE_PUBLISH so a merge that silently published nothing
      # (missing token) fails loudly rather than reporting a green edge run that
      # moved no pointer.
      - name: Publish edge and advance cli/edge
        id: publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: "true"
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bun run scripts/publish-edge-blob.ts "$VERSION"

  # THE INSTALL BASE'S QUESTION, ASKED ONCE PER MERGE.
  #
  # Every other gate in this repository asks whether the PREVIOUS release can
  # reach this build. Nobody is on the previous release. The oldest installs
  # still updating are 1.0.x and 1.1.0, and their journey is not one hop:
  #
  #   1.0.1  -> `apps/api`'s legacy bridge pin (wego/foundations#132) serves any
  #             ring-`stable` `?dl=` whose agent starts with `Bun/` from the FROZEN
  #             `cli/cli-v1.1.0/` prefix -> lands on 1.1.0 -> and only THEN reads
  #             the live pointer. Two hops, and the first is wego-ai's signature
  #             to verify, not this repository's.
  #   1.1.0  -> the relay release: it trusts `wego/cli`'s identities, so it reads
  #             the live pointer directly. One hop.
  #
  # So 1.0.1's fate is 1.1.0's fate plus a frozen prefix neither this repository
  # nor any change in it can move. The ONE question a change here can answer is
  # therefore: can a 1.1.0 binary VERIFY AND INSTALL the bytes this commit built?
  # That is what runs below, against the ring this lane just advanced.
  #
  # WHY HERE AND NOT ON THE PULL REQUEST. The answer needs a real sigstore record
  # a 2024-vintage binary accepts, and the identities it accepts are workflow refs
  # (`edge-cli.yml@refs/heads/main`, `release-cli.yml@refs/tags/v*`). A pull
  # request mints `@refs/pull/N/merge`, which every shipped binary refuses by
  # design - correctly, and not something to weaken for a test. `cli/edge` is the
  # earliest point where signed bytes for THIS code exist, so this is the earliest
  # honest gate. It reports one merge after the change, not one release after it.
  #
  # NOT a required check, and deliberately: it runs after the pointer has already
  # moved, so it is a detector, not a preventer. What it prevents is the NEXT
  # release - a failure here is the signal to stop before a tag.
  upgrade-paths:
    name: Upgrade paths reach this build
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:`, no store token: everything below is a public object or a
    # public route, fetched exactly as a user's machine fetches it. A gate that
    # held a credential could reach bytes a consumer cannot.
    permissions:
      contents: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The predecessor is an IMMUTABLE published artifact, addressed by its own
      # frozen prefix rather than by a pointer. That is what makes a re-run
      # meaningful: the start binary is the same genuine 1.1.0 every time, so it
      # can never drift forward to meet the destination and turn this green
      # without exercising anything - the greenwash `update-smoke.sh` guards with
      # `--require-replace` and this script refuses outright.
      #
      # linux-x64 is this runner's platform. The macOS-only quarantine clear is
      # the sole step of the real update path not covered here; `release-cli.yml`
      # carries the same limitation.
      - name: 1.1.0 (relay) -> this edge build
        env:
          ORIGIN: ${{ needs.publish.outputs.store_origin }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sh scripts/upgrade-path.sh \
            "$ORIGIN/cli/cli-v1.1.0/wego-linux-x64" edge "$VERSION" --max-hops 1

      # THE FROZEN HOP, checked as a CONTRACT rather than re-walked.
      #
      # 1.0.1 cannot verify anything `wego/cli` signs - its baked trust set names
      # wego-ai only - so it cannot be pointed at `edge` at all, and driving it to
      # `stable` here would measure the last RELEASE, not this commit. What is
      # worth asserting on every merge is that its route still exists: the pin
      # still claims a `Bun/` agent, and the frozen prefix still serves the
      # manifest and the wego-ai-signed record that agent will be handed.
      #
      # Nothing in this repository can break these. They are here because if they
      # ever DO break - an `apps/api` deploy, a store lifecycle rule collecting an
      # old prefix - every 1.0.x install stops updating silently, and this lane
      # runs often enough to notice within a day.
      - name: The 1.0.x bridge hop still exists
        env:
          ORIGIN: ${{ needs.publish.outputs.store_origin }}
          # The agent a real 1.0.x machine sends, and the only input the pin
          # reads. Passed to `curl -A` as data, never interpolated into a shell
          # word.
          LEGACY_AGENT: Bun/1.1.29
          INSTALL_URL: https://api.wego.com/install
        run: |
          set -euo pipefail
          loc=$(curl -sI -A "$LEGACY_AGENT" \
                  "$INSTALL_URL?dl=SHA256SUMS.txt&ring=stable" \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          case "$loc" in
            */cli/cli-v1.1.0/SHA256SUMS.txt)
              echo "ok: the pin still routes a pre-relay agent to the frozen bridge - $loc" ;;
            *)
              echo "::error::a pre-relay agent on ring stable is served '$loc', not the frozen cli/cli-v1.1.0 prefix. Every 1.0.x install would now follow the live pointer, whose record it cannot verify - it could no longer update at all."
              exit 1 ;;
          esac

          # And the prefix it points at must still hold BOTH halves: the manifest
          # and the wego-ai-signed record. A pointer at a collected prefix is a
          # 404 to every 1.0.x machine, which fails closed and stops updating.
          for f in SHA256SUMS.txt VERSION wego-linux-x64.gz; do
            curl -fsS -o /dev/null "$ORIGIN/cli/cli-v1.1.0/$f" \
              || { echo "::error::the frozen bridge prefix is missing $f - every 1.0.x install fails closed here."; exit 1; }
          done
          curl -fsS -o /dev/null "$ORIGIN/cli-sig/cli-v1.1.0/SHA256SUMS.txt.sigstore.json" \
            || { echo "::error::the frozen bridge's signed record is gone - 1.0.x installs refuse the manifest and stop updating."; exit 1; }
          echo "ok: the frozen bridge still serves a complete, signed 1.1.0."
