name: Promote (cli)

# Move `cli/stable` to the tag that `cli/next` serves. This is the second human
# action in a release. The first is merging the release PR.
#
# A promote copies the frozen `cli/<tag>/` bytes to `cli/stable`. Nothing is
# rebuilt. `wego update` compares checksums, not versions, so every install on
# `stable` takes the new bytes at its next check.
#
# A published binary cannot be recalled. Every gate runs before the pointer moves.
# The recovery after a bad promote is `rollback-cli.yml`, which moves `cli/stable`
# to an earlier tag. This workflow has no rollback mode. It only moves `stable` to
# what `next` serves, and every gate may assume `next == tag`.
# `scripts/workflow-lanes.test.ts` asserts that.
#
# When `SKILLS_PUBLISH_ENABLED` is 'true', the `promote` job also publishes the
# plugin from the tag's tree to `wego/skills` after the move.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The vX.Y.Z tag to promote to cli/stable. Must already be published, and must be what cli/next serves. To put stable back on an EARLIER release, use rollback-cli.yml.'
        required: true
        type: string

# No tag and no Release is created here. `actions: read` on the `promote` job is
# for the release-run check.
permissions:
  contents: read

jobs:
  # The human gate.
  #
  # Not an environment with required reviewers. That rule is not available on this
  # plan for a private repository, and an unprotected environment would let every
  # dispatch through (wego/foundations#128). The list below is the authority.
  # `main` requires a code-owner review, so a change to the list is reviewed.
  #
  # One person dispatches and approves. There is no four-eyes rule. This job holds
  # no secrets and no variables.
  #
  # Both actors must be promoters, not just one. `github.actor` is the original
  # dispatcher and does not change on a re-run. `github.triggering_actor` is
  # whoever started this run. Re-running a run needs only write access, so a check
  # on `github.actor` alone passes a replay of a past promote under the original
  # promoter's name.
  approve:
    name: Approve promoting ${{ inputs.tag }} to cli/stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only a named promoter may promote
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROMOTERS: sunny-wego yeouchien-wego chuyeowego
        run: |
          set -euo pipefail

          is_promoter() {
            candidate="$1"
            for p in $PROMOTERS; do
              if [ "$p" = "$candidate" ]; then return 0; fi
            done
            return 1
          }

          # `github.actor` is the ORIGINAL dispatcher and does NOT change on a
          # re-run; `github.triggering_actor` is whoever started THIS run. Both
          # must be promoters. Checking only the first lets anyone with write
          # access re-run a past run of this lane and have the gate pass on the
          # original promoter's name - which for the rollback lane is a replay
          # that moves `cli/stable` onto an old tag.
          #
          # Call `is_promoter` inside an `if !` condition, never as a bare
          # statement: `set -e` is suspended for a command used as a condition,
          # and writing the loop body as `[ ... ] && return 0` would make a
          # non-matching iteration return non-zero and trip `set -e`.
          if ! is_promoter "$ACTOR"; then
            echo "::error::$ACTOR is not a named promoter. Allowed: $PROMOTERS"
            exit 1
          fi
          if ! is_promoter "$TRIGGERING_ACTOR"; then
            echo "::error::$TRIGGERING_ACTOR re-ran this run and is not a named promoter. Allowed: $PROMOTERS"
            exit 1
          fi

          echo "$ACTOR dispatched and $TRIGGERING_ACTOR ran this; both are named promoters."

      - name: Record what is being approved
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "Approved: promote $TAG to cli/stable."

  promote:
    name: Promote ${{ inputs.tag }} to cli/stable
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same group as `rollback-cli.yml`: both write `cli/stable`. `release-cli.yml`
    # writes `cli/next` and has its own group. Do not cancel a move in progress.
    concurrency:
      group: ring-stable
      cancel-in-progress: false
    # The store token lives here.
    environment:
      name: production
    permissions:
      contents: read
      # For the release-run check below.
      actions: read
    env:
      WEGO_CLI_TELEMETRY: "0"
    steps:
      # Check out the tag, not main. The plugin publisher reads the tag's tree.
      # Consequence: every script in this job is the tag's version. A check that
      # must work for a tag cut before the script existed is inline (see the agent
      # probe below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # The tag is the only typed input. Same parser as the release lane. A
      # prerelease is refused; `ring-rules.ts` refuses it again at publish time.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/validate-release-tag.ts "$TAG"
          case "${TAG#v}" in
            *-*)
              echo "::error::$TAG is a prerelease. cli/stable serves only a plain X.Y.Z - a prerelease belongs on cli/edge, which edge-cli.yml publishes."
              exit 1 ;;
          esac
          echo "ok: $TAG is a plain release version."

      # Read what `cli/stable` serves before the move replaces it. Every failure
      # message after the move names this as the rollback target.
      #
      # Tag grammar: wego-ai published `cli-vX.Y.Z` up to 1.1.0. This repository
      # publishes `vX.Y.Z` from 1.2.0. The lane that can roll back follows from
      # the version.
      - name: Record the rollback target (what cli/stable serves today)
        id: outgoing
        run: |
          set -euo pipefail
          version=$(curl -fsSL 'https://api.wego.com/install?dl=VERSION&ring=stable' 2>/dev/null || true)
          version=$(printf '%s' "$version" | tr -d '\r\n')
          if [ -z "$version" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "how=NO ROLLBACK TARGET: cli/stable serves nothing today, so there is no previous build to put back." >> "$GITHUB_OUTPUT"
            echo "::warning::cli/stable currently serves no VERSION - rollback guidance in this run will say so."
            exit 0
          fi
          case "$version" in
            1.0.*|1.1.*) tag="cli-v$version"; lane="wego-ai's promote-cli.yml" ;;
            *)           tag="v$version";     lane="this repository's rollback-cli.yml" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "how=ROLL BACK: run $lane with tag=$tag." >> "$GITHUB_OUTPUT"
          echo "rollback target: $tag via $lane"

      # `cli/<tag>/` can exist half-written if the release lane did not finish.
      # Require one completed, successful `release-cli.yml` run for this tag.
      # `branch=<tag>` is how the Actions API filters a tag-push run.
      # `github-script`, not `gh`: one shape across the lanes.
      - name: Require a completed, successful release run for the tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.TAG;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release-cli.yml",
              branch: tag,
              per_page: 100,
            });
            const ok = data.workflow_runs.filter(
              (r) => r.status === "completed" && r.conclusion === "success",
            ).length;
            if (ok < 1) {
              core.setFailed(
                `No completed, successful release-cli.yml run for ${tag}. cli/stable serves every install, so it is only ever advanced onto bytes a release run finished and verified. Re-run or fix the release for ${tag} first.`,
              );
              return;
            }
            core.info(`ok: release-cli.yml completed successfully for ${tag} (${ok} run(s)).`);
        env:
          TAG: ${{ inputs.tag }}

      # With the flag on, the plugin steps below exit 0 for a tag whose tree has no
      # publisher. That would move `stable` and then publish nothing, with a green
      # run. Refuse before the move.
      - name: Refuse a tag whose tree cannot publish the plugin
        if: vars.SKILLS_PUBLISH_ENABLED == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          missing=''
          for f in scripts/publish-plugin.ts scripts/verify-plugin-published.ts; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -z "$missing" ]; then
            echo "ok: $TAG carries the plugin publish lane."
            exit 0
          fi
          echo "::error::$TAG has no plugin publish lane in its tree (missing:$missing) and SKILLS_PUBLISH_ENABLED is on. Refusing before cli/stable moves: promoting would move both rings and then skip the publish, which reports success for a promote that published nothing. If you meant to put cli/stable back on an EARLIER release, use rollback-cli.yml - it publishes no plugin and does not care."
          exit 1

      # "cli/next serves this tag" is enforced by the publisher
      # (`--require-serving next` in "Advance cli/stable"), not by a step here. The
      # publisher holds the store origin it writes to, so the gate and the write
      # use the same store.

      # 1.0.0 and 1.0.1 installs trust only wego-ai's signing identity. apps/api
      # serves any `ring=stable` request with a `Bun/` user agent from the frozen
      # `cli/cli-v1.1.0/` prefix (wego/foundations#132). Require that pin to answer
      # before `stable` moves. Without it, those installs can never update again.
      # There is no bypass input.
      #
      # `rollback-cli.yml` does not carry this gate: a 1.0.x install never reads
      # the pointer a rollback moves.
      - name: Require the legacy bridge pin to be live
        run: |
          set -euo pipefail
          loc=$(curl -sI -A 'Bun/1.3.14' \
                  'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=stable' \
                  | grep -i '^location:' || true)
          if printf '%s' "$loc" | grep -q '/cli/cli-v1.1.0/'; then
            echo "ok: an old (Bun/) binary asking stable is served from the bridge prefix."
            echo "$loc"
            exit 0
          fi
          echo "::error::the legacy bridge pin is NOT live: a Bun/ user agent asking for stable is answered with '${loc:-no location header}', which does not name /cli/cli-v1.1.0/. Moving cli/stable now would strand every 1.0.0 and 1.0.1 install that follows it, permanently and unrecoverably. Publish the bridge and set CLI_LEGACY_BRIDGE_RING + CLI_LEGACY_BRIDGE_TAG on the production apps/api deploy first (wego/foundations#132)."
          exit 1

      # The probe above reads one header. This step drives a real 1.0.1 binary
      # through the pin, the frozen prefix and the live pointer, to the release
      # `stable` serves today. It proves the route, not the new tag. Skipped when
      # `stable` is empty.
      - name: Walk the pre-relay route before moving anything
        if: steps.outgoing.outputs.version != ''
        env:
          OUTGOING: ${{ steps.outgoing.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=stable' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/stable/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect: '$loc'. Refusing to move cli/stable on an unverified route."
            exit 1
          fi
          if ! sh scripts/upgrade-path.sh \
                 "$origin/cli/cli-v1.0.1/wego-linux-x64" stable "$OUTGOING" \
                 --via 1.1.0 --max-hops 2; then
            echo "::error::the pre-relay route is broken as it stands TODAY, against the release cli/stable already serves ($OUTGOING) - so this is not about $TAG. Either the bridge pin no longer delivers a usable frozen prefix, or the hop off 1.1.0 does not work. NOTHING HAS MOVED YET. Fix apps/api or restore cli/cli-v1.1.0 before promoting: moving the pointer now would add a second, independent failure on top of one that already strands every 1.0.x install."
            exit 1
          fi
          echo "ok: the full 1.0.1 -> 1.1.0 -> stable route works against the outgoing release."

      # The complement of the pin probe. The tag's binary must not send a `Bun/`
      # user agent, or the pin claims it and it can never update. v1.2.0 shipped
      # that way (wego/cli#25).
      #
      # Part 1: record the agent with a loopback listener, then ask the real route
      # what it does with that agent. Part 2: run a real `update` against
      # `cli/next`, which serves this tag; the expected result is "up to date".
      # Part 2 does not use `stable`: during the migration `stable` served a
      # wego-ai tag that no wego/cli binary accepts, so an outcome test there fails
      # for a reason unrelated to the candidate (wego/cli#29).
      #
      # The same check runs in `.github/actions/verify-build` before publication.
      # It is repeated here because the route can change between release and
      # promote. Inline, not a script: this job runs the tag's tree, and older tags
      # do not carry the script.
      - name: Require this tag's binary to be distinguishable from a pre-relay install
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url='https://api.wego.com/install'
          work="$RUNNER_TEMP/agent-probe"; rm -rf "$work"
          mkdir -p "$work/bin" "$work/home/.config/wego"

          # `--require-serving next` owns this rule but runs later. Say it here.
          served=$(curl -fsSL "$url?dl=VERSION&ring=next" || true)
          if [ "$served" != "${TAG#v}" ]; then
            echo "::error::cli/next serves '${served:-nothing}', not ${TAG#v}, so the bytes this gate would test are not $TAG's. Promote the build that ring has been running. To put cli/stable back on an EARLIER release, use rollback-cli.yml."
            exit 1
          fi
          if ! curl -fsSL "$url?dl=wego-linux-x64&ring=next" -o "$work/bin/wego"; then
            echo "::error::could not download wego-linux-x64 from cli/next at $url. The ring reports ${TAG#v} but is not serving a complete artifact set."
            exit 1
          fi
          chmod +x "$work/bin/wego"

          # A listener that records the agent and answers 404. `bun -e`, not a
          # heredoc: a heredoc inside a YAML block scalar carries the indentation.
          : > "$work/agent.txt"
          AGENT_FILE="$work/agent.txt" bun -e 'const out=Bun.file(process.env.AGENT_FILE).writer();Bun.serve({hostname:"127.0.0.1",port:8977,fetch(r){out.write((r.headers.get("user-agent")??"")+"\n");out.flush();return new Response("probe",{status:404});}});' &
          LPID=$!
          sleep 2

          # The binary must be named `wego`. The config directory follows the
          # invoked name.
          printf '{"ring":"stable","installUrl":"http://127.0.0.1:8977/install"}\n' \
            > "$work/home/.config/wego/install.json"
          set +e
          out=$(HOME="$work/home" XDG_CONFIG_HOME="$work/home/.config" \
                WEGO_CLI_TELEMETRY=0 "$work/bin/wego" update -y 2>&1)
          set -e
          kill "$LPID" 2>/dev/null || true
          echo "$out"

          # `update` exits 0 without a request for a dev-versioned binary.
          if printf '%s' "$out" | grep -q 'Self-update applies to installed release binaries'; then
            echo "::error::$TAG's binary does not consider itself a release build, so it never made a request and this check measured NOTHING. It was built without WEGO_BUILD_VERSION."
            exit 1
          fi
          agent=$(head -1 "$work/agent.txt" || true)
          if [ -z "$agent" ]; then
            echo "::error::$TAG's binary made no request to the probe, so its user agent could not be measured and this check proved NOTHING. Output above."
            exit 1
          fi
          echo "$TAG's binary sends: $agent"

          # The pin's own predicate.
          if printf '%s' "$agent" | grep -qiE '^bun/'; then
            echo "::error::$TAG's binary sends '$agent', which apps/api's legacy bridge pin treats as a pre-relay 1.0.x install. Promoting it would pin every install of this build to the frozen bridge, whose record it cannot verify - it could never update again. That is exactly what v1.2.0 shipped (wego/cli#25)."
            exit 1
          fi

          # The real route's decision for this agent.
          loc=$(curl -sI -A "$agent" "$url?dl=SHA256SUMS.txt&ring=stable" \
                  | grep -i '^location:' || true)
          if printf '%s' "$loc" | grep -q '/cli/cli-v1.1.0/'; then
            echo "::error::api.wego.com serves $TAG's binary ('$agent') from the legacy bridge on ring stable: '$loc'. Promoting it would strand every install of this build."
            exit 1
          fi
          echo "ok: $TAG's binary is not claimed by the pin. $loc"

          # Part 2: a full update against cli/next.
          rm -rf "$work/outcome"; mkdir -p "$work/outcome/bin" "$work/outcome/home/.config/wego"
          cp "$work/bin/wego" "$work/outcome/bin/wego"
          printf '{"ring":"next","installUrl":"%s"}\n' "$url" \
            > "$work/outcome/home/.config/wego/install.json"
          set +e
          up=$(HOME="$work/outcome/home" XDG_CONFIG_HOME="$work/outcome/home/.config" \
               WEGO_CLI_TELEMETRY=0 "$work/outcome/bin/wego" update -y 2>&1)
          code=$?
          set -e
          echo "$up"
          if [ "$code" -ne 0 ]; then
            echo "::error::$TAG's binary cannot complete an update against cli/next (exit $code), which serves this very tag. Promoting it would put a build in front of every install that cannot receive another release. Exit 6 means a signed record it does not accept; anything else is in the download, manifest or replace path."
            exit 1
          fi
          if ! printf '%s' "$up" | grep -qi 'up to date'; then
            echo "::error::$TAG's binary did not report itself current against cli/next, which serves ${TAG#v} - it replaced itself instead. cli/next is not serving the bytes this tag published."
            exit 1
          fi
          echo "ok: $TAG's binary completes a real update against cli/next and reports itself current."

      # Two checks, both before the move.
      #
      # 1. `cli/next` and `cli/<tag>/` must hold identical manifests. The gates test
      #    `next`; the promote copies `cli/<tag>/`. `--require-serving` compares
      #    version strings, not bytes.
      # 2. `cli/<tag>/` must carry exactly the asset set below. `verify-published.sh`
      #    checks only what the manifest lists, so a build that stopped emitting a
      #    platform would pass it. The list is a literal on purpose. A new platform
      #    must update it.
      - name: Require the bytes that will land to be the bytes under test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=next' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/next/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect for ring next: '$loc'."
            exit 1
          fi

          curl -fsSL "$origin/cli/$TAG/SHA256SUMS.txt" > "$RUNNER_TEMP/tag.sums"
          curl -fsSL "$origin/cli/next/SHA256SUMS.txt" > "$RUNNER_TEMP/next.sums"

          # Sorted: the manifests come from separate `sha256sum *` runs.
          if ! diff -u <(sort "$RUNNER_TEMP/next.sums") <(sort "$RUNNER_TEMP/tag.sums"); then
            echo "::error::cli/$TAG and cli/next do not hold identical bytes. The gate below tests cli/next, but the promote copies cli/$TAG - so promoting now would ship bytes nothing has exercised. cli/next was supposed to BE this tag; find out what republished one of them."
            exit 1
          fi
          echo "ok: cli/next is byte-identical to cli/$TAG, so testing next tests what will be copied."

          # Every platform, raw and gzipped, plus VERSION.
          expected='VERSION
          wego-darwin-arm64
          wego-darwin-arm64.gz
          wego-darwin-x64
          wego-darwin-x64.gz
          wego-linux-arm64
          wego-linux-arm64.gz
          wego-linux-x64
          wego-linux-x64.gz
          wego-windows-x64.exe
          wego-windows-x64.exe.gz'
          printf '%s\n' "$expected" | sed 's/^ *//' | sort > "$RUNNER_TEMP/expected.names"
          awk '{print $2}' "$RUNNER_TEMP/tag.sums" | sort > "$RUNNER_TEMP/actual.names"
          if ! diff -u "$RUNNER_TEMP/expected.names" "$RUNNER_TEMP/actual.names"; then
            echo "::error::cli/$TAG does not carry exactly the expected asset set (- expected, + found above). A MISSING asset strands every install on that platform: it would be offered a download that 404s, forever, and no existing check would have said so. An EXTRA asset means a new platform shipped without this gate being updated. Fix the build, or update the expected set here deliberately."
            exit 1
          fi
          echo "ok: cli/$TAG carries every expected platform, raw and gzipped."

      # The anti-brick gate, repeated at the stable decision. The release lane
      # proved this before publication. The bytes are unchanged; the route and the
      # store may have changed. Pointed at `stable`, which serves the outgoing
      # release, so a real byte swap happens. A build that cannot update cannot take
      # a rollback either.
      - name: Require this tag's binary to be able to update itself for real
        env:
          TAG: ${{ inputs.tag }}
          OUTGOING: ${{ steps.outgoing.outputs.version }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -z "$OUTGOING" ]; then
            echo "::error::cli/stable serves no VERSION, so this binary's replace path cannot be exercised against it. Refusing to point every install at a build whose ability to leave is unproven here."
            exit 1
          fi
          if [ "$OUTGOING" = "$version" ]; then
            echo "::error::cli/stable already serves $version - this tag is already promoted, so no byte swap can be exercised and this gate would prove nothing."
            exit 1
          fi
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=next' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/next/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect for ring next: '$loc'."
            exit 1
          fi
          if ! sh scripts/upgrade-path.sh \
                 "$origin/cli/$TAG/wego-linux-x64" stable "$OUTGOING" --max-hops 1; then
            echo "::error::$TAG's binary CANNOT UPDATE ITSELF against the live route. Pointing cli/stable at it would brick every machine that takes it, and a rollback would not reach them - a binary that cannot update cannot take one. NOTHING HAS MOVED YET. This passed in the release lane, so what changed is the route or the store, not the build: check apps/api and the signing certificates. See wego/cli#25."
            exit 1
          fi
          echo "ok: $TAG's binary performs a real self-replace against today's route - it can leave."

      # The last gate before the move. Can the installed population arrive at this
      # tag? 1.1.0 is the hinge: the bridge pin lands every 1.0.x install on 1.1.0
      # first. Drives a real 1.1.0 binary onto `cli/next`, which holds the bytes
      # `stable` is about to serve. The predecessor is the frozen `cli/cli-v1.1.0/`
      # artifact, so a re-run always starts from the same binary.
      - name: Require the install base to be able to reach this tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          loc=$(curl -sI 'https://api.wego.com/install?dl=SHA256SUMS.txt&ring=next' \
                | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          origin=${loc%/cli/next/SHA256SUMS.txt}
          if [ -z "$origin" ] || [ "$origin" = "$loc" ]; then
            echo "::error::could not read the store origin out of the install route's redirect for ring next: '$loc'. Refusing to move cli/stable on an unverified route."
            exit 1
          fi
          if ! sh scripts/upgrade-path.sh \
                 "$origin/cli/cli-v1.1.0/wego-linux-x64" next "$version" --max-hops 1; then
            echo "::error::a 1.1.0 install cannot reach $version on cli/next, which serves the exact bytes this promote is about to copy onto cli/stable. Moving the pointer would strand every install at or below 1.1.0 - and every 1.0.x machine with it, since the bridge pin lands those on 1.1.0 first. NOTHING HAS MOVED YET: fix the build and re-run. Exit 6 means a signed record 1.1.0 does not accept."
            exit 1
          fi
          echo "ok: a 1.1.0 install reaches $version on the bytes cli/stable is about to serve."

      # The move: a server-side copy of `cli/<tag>/` to `cli/stable`.
      # `--require-serving next`: refuse unless `cli/next` serves this tag.
      # REQUIRE_PUBLISH: a missing token fails instead of exit 0.
      - name: Advance cli/stable
        id: promote
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REQUIRE_PUBLISH: 'true'
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun run scripts/upload-release-blob.ts --promote "$TAG" --to stable --require-serving next

      # Hash-check every asset on the ring against the manifest it now serves.
      - name: Verify cli/stable
        if: steps.promote.outputs.store_origin != ''
        env:
          BASE: ${{ steps.promote.outputs.store_origin }}/cli/stable
          VERSION: ${{ inputs.tag }}
        run: sh scripts/verify-published.sh "$BASE" "${VERSION#v}" all

      # The claim the design rests on: what the candidate group ran is what everyone
      # receives. A difference means something rebuilt.
      - name: Prove cli/next and cli/stable are byte-identical
        if: steps.promote.outputs.store_origin != ''
        env:
          ORIGIN: ${{ steps.promote.outputs.store_origin }}
        run: |
          set -euo pipefail
          curl -fsSL "$ORIGIN/cli/next/SHA256SUMS.txt"   > "$RUNNER_TEMP/next.sums"
          curl -fsSL "$ORIGIN/cli/stable/SHA256SUMS.txt" > "$RUNNER_TEMP/stable.sums"
          # Sorted: the manifests come from separate `sha256sum *` runs.
          if ! diff -u <(sort "$RUNNER_TEMP/next.sums") <(sort "$RUNNER_TEMP/stable.sums"); then
            echo "::error::cli/next and cli/stable do not serve identical bytes. A promote is a server-side COPY of the frozen cli/<tag> blobs, so this can only mean something rebuilt between publish and promote. Do not paper over it - find the rebuild."
            exit 1
          fi
          echo "ok: cli/next and cli/stable serve byte-identical artifacts."
          cat "$RUNNER_TEMP/stable.sums"

      # The publisher copies the signed record and the manifest as two writes, and
      # `waitChannelConsistent` polls only `cli/<ring>`, not `cli-sig/<ring>`. Ring
      # objects have `cacheControlMaxAge` 60 s, so the route can serve the new
      # manifest with the old record for up to 60 s. A client that fetches both
      # refuses. Run 35108775349 rolled back a good v1.3.0 for that reason.
      #
      # Wait until both objects, read through `/install`, match the frozen prefix
      # byte for byte. Bounded: 12 x 10 s. Remove this step, and the retry below,
      # when ring resolution moves into apps/api and a ring becomes one pointer.
      - name: Wait for cli/stable to be coherent through the install route
        if: steps.promote.outputs.store_origin != ''
        env:
          ORIGIN: ${{ steps.promote.outputs.store_origin }}
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ steps.outgoing.outputs.how }}
        run: |
          set -euo pipefail
          url='https://api.wego.com/install'
          curl -fsSL "$ORIGIN/cli/$TAG/SHA256SUMS.txt" > "$RUNNER_TEMP/tag.sums"
          curl -fsSL "$ORIGIN/cli-sig/$TAG/SHA256SUMS.txt.sigstore.json" \
            > "$RUNNER_TEMP/tag.sig"

          for attempt in $(seq 1 12); do
            curl -fsSL "$url?dl=SHA256SUMS.txt&ring=stable" \
              > "$RUNNER_TEMP/served.sums"
            curl -fsSL "$url?dl=SHA256SUMS.txt.sigstore.json&ring=stable&sig=1" \
              > "$RUNNER_TEMP/served.sig"
            cmp -s "$RUNNER_TEMP/tag.sums" "$RUNNER_TEMP/served.sums" && m=ok || m=stale
            cmp -s "$RUNNER_TEMP/tag.sig"  "$RUNNER_TEMP/served.sig"  && r=ok || r=stale
            if [ "$m" = ok ] && [ "$r" = ok ]; then
              echo "ok: the install route serves $TAG's manifest AND its signed record for ring stable."
              exit 0
            fi
            echo "... settling [$attempt/12]: manifest=$m record=$r"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done

          echo "::error::cli/stable did not become coherent through the install route within 120s: the manifest and the signed record it serves for ring stable do not both match the frozen $TAG prefix. Every client that fetches them together will refuse to install, fail-closed. $ROLLBACK"
          exit 1

      # A binary taken from `stable` must report "up to date" against `stable`.
      #
      # Exit 5 with "for a different manifest" is the CLI's retryable verdict for
      # a ring mid-flip (`update.ts` EXIT.RETRYABLE). Retry up to 8 x 15 s. Any
      # other exit 5 is not retried. The wait above should make retries 0; any
      # retry gets a warning so a growing window is visible.
      - name: Verify a promoted binary reports itself current
        if: steps.promote.outputs.store_origin != ''
        env:
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ steps.outgoing.outputs.how }}
        run: |
          set -euo pipefail
          url='https://api.wego.com/install'
          work="$RUNNER_TEMP/selfupdate-after"; rm -rf "$work"
          mkdir -p "$work/bin" "$work/home/.config/wego"
          curl -fsSL "$url?dl=wego-linux-x64&ring=stable" -o "$work/bin/wego"
          chmod +x "$work/bin/wego"
          printf '{"ring":"stable","installUrl":"%s"}\n' "$url" \
            > "$work/home/.config/wego/install.json"

          attempt=0
          while :; do
            set +e
            out=$(HOME="$work/home" XDG_CONFIG_HOME="$work/home/.config" \
                  WEGO_CLI_TELEMETRY=0 "$work/bin/wego" update -y 2>&1)
            code=$?
            set -e
            echo "$out"

            if [ "$code" -ne 5 ]; then break; fi
            if ! printf '%s' "$out" | grep -q 'for a different manifest'; then break; fi

            attempt=$((attempt + 1))
            if [ "$attempt" -ge 8 ]; then
              echo "::error::cli/stable never became coherent: a binary taken from it still reports that its manifest and its signed record disagree, after 8 attempts over 2 minutes. The barrier above passed, so this is not the ordinary propagation window - the record did not converge at all, which points at the publisher or the store rather than at $TAG's build. $ROLLBACK"
              exit 1
            fi
            echo "... exit 5 (manifest and record do not yet agree) - retry $attempt/8 in 15s"
            sleep 15
          done

          if [ "$attempt" -gt 0 ]; then
            echo "::warning::cli/stable needed $attempt retries before a binary from it could verify the ring. The barrier above is meant to make that 0 - if this recurs, the propagation window is growing."
          fi

          if [ "$code" -ne 0 ]; then
            echo "::error::a binary taken from cli/stable cannot update itself (exit $code). cli/stable now serves $TAG and every install following it is affected. $ROLLBACK See wego/cli#25. Note that a rollback cannot reach a machine that already took these bytes AND cannot update - it has to be reinstalled."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qi 'up to date'; then
            echo "::error::a binary taken from cli/stable did not report itself current - it replaced itself. cli/stable is not serving the bytes this promote just copied."
            exit 1
          fi
          echo "ok: a binary from cli/stable asks stable and is told it is current."

      # Verification, not a gate. The pre-move gate drove `next`; this drives
      # `stable`, the pointer every install follows. 1.1.0 in one hop. 1.0.1 in two
      # hops through the frozen bridge; `--via` pins the route.
      #
      # A 1.0.1 failure is not fixed by a rollback: that install never reads this
      # pointer. Fix apps/api or the frozen prefix instead.
      - name: Verify the install base can reach this promote
        if: steps.promote.outputs.store_origin != ''
        env:
          ORIGIN: ${{ steps.promote.outputs.store_origin }}
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ steps.outgoing.outputs.how }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          if ! sh scripts/upgrade-path.sh \
                 "$ORIGIN/cli/cli-v1.1.0/wego-linux-x64" stable "$version" --max-hops 1; then
            echo "::error::a 1.1.0 install cannot reach $TAG on cli/stable. Every install at or below 1.1.0 - including every 1.0.x machine, which lands on 1.1.0 first - is now stranded on the pointer this promote just moved. $ROLLBACK"
            exit 1
          fi

          if ! sh scripts/upgrade-path.sh \
                 "$ORIGIN/cli/cli-v1.0.1/wego-linux-x64" stable "$version" \
                 --via 1.1.0 --max-hops 2; then
            echo "::error::a 1.0.1 install cannot reach $TAG on cli/stable in two hops via the frozen bridge. Either the legacy bridge pin no longer claims a pre-relay agent, or the second hop off 1.1.0 is broken. A ROLLBACK WILL NOT FIX THIS: a 1.0.x machine is pinned to cli/cli-v1.1.0 and never reads this pointer, so repoint apps/api or restore the frozen prefix instead. (If the second hop is what broke, $ROLLBACK)"
            exit 1
          fi
          echo "ok: both 1.0.1 and 1.1.0 installs converge on $version."

      # No skill steps. The SKILL.md ships inside the binary, and `update` runs
      # `skill install --owned-only` after the swap.

      # Skipped when the flag is off. Without this guard the publish step ran with
      # no token and REQUIRE_PUBLISH, and failed after `stable` had moved
      # (wego/foundations#129, run 34610149769).
      - name: Mint the plugin publish token
        id: plugin-token
        if: steps.promote.outputs.store_origin != '' && vars.SKILLS_PUBLISH_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SKILLS_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_PUBLISH_APP_PRIVATE_KEY }}
          owner: wego
          repositories: skills
          permission-contents: write

      # The steps are main's; the tree is the tag's. A tag cut before this lane
      # existed has no publisher script. Skip, do not fail after the move.
      #
      # Credential handling: `http.extraheader` through `GIT_CONFIG_COUNT`, never a
      # token in the remote URL (the publisher prints the remote). The base64 value
      # is masked because Actions masks only the raw token. The header matches every
      # github.com URL, so run no other git command in this step.
      - name: Publish the plugin repo
        if: steps.promote.outputs.store_origin != '' && vars.SKILLS_PUBLISH_ENABLED == 'true'
        env:
          SKILLS_PUBLISH_TOKEN: ${{ steps.plugin-token.outputs.token }}
          REQUIRE_PUBLISH: 'true'
        run: |
          if [ ! -f "scripts/publish-plugin.ts" ]; then
            echo "scripts/publish-plugin.ts is not in this tag's tree - skipping."
            exit 0
          fi
          if [ -n "${SKILLS_PUBLISH_TOKEN:-}" ]; then
            AUTH=$(printf 'x-access-token:%s' "$SKILLS_PUBLISH_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$AUTH"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
            export SKILLS_PLUGIN_REPO="https://github.com/wego/skills.git"
          fi
          bun run scripts/publish-plugin.ts

      # Read back from an independent clone. The publish step proves the paths; this
      # proves the content. Same guard and same credential handling as above.
      - name: Verify the plugin repo
        if: steps.promote.outputs.store_origin != '' && vars.SKILLS_PUBLISH_ENABLED == 'true'
        env:
          SKILLS_PUBLISH_TOKEN: ${{ steps.plugin-token.outputs.token }}
        run: |
          if [ ! -f "scripts/verify-plugin-published.ts" ]; then
            echo "scripts/verify-plugin-published.ts is not in this tag's tree - skipping."
            exit 0
          fi
          if [ -n "${SKILLS_PUBLISH_TOKEN:-}" ]; then
            AUTH=$(printf 'x-access-token:%s' "$SKILLS_PUBLISH_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$AUTH"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
            export SKILLS_PLUGIN_REPO="https://github.com/wego/skills.git"
          fi
          bun run scripts/verify-plugin-published.ts

      - name: Summary
        if: steps.promote.outputs.store_origin != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Promoted \`$TAG\` to \`cli/stable\`"
            echo
            echo "Everyone on \`wego update\` receives this build from now on."
            echo "It is byte-identical to what \`cli/next\` served."
          } >> "$GITHUB_STEP_SUMMARY"
