# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# The npm tree in `bun.lock` is covered by `bun audit` in `ci-cli` and the
# release lane. This file covers GitHub Actions: those used in workflows, and
# those used only inside composite actions under `.github/actions/`, which the
# dependency graph does not see. The most important is
# `sigstore/cosign-installer`, which runs in the `sign` job, the only job with
# `id-token: write`. SHA pins stop a compromised publisher from pushing new code,
# but they do not tell you when a pinned version is disclosed as vulnerable.
#
# No `bun` ecosystem entry, on purpose. There is one runtime dependency,
# `bun audit` already watches that tree, and `/package.json` and `/bun.lock`
# need a release signer's review in CODEOWNERS, so every lockfile bump would
# take one of three named reviewers for a PR with nothing to review.

version: 2

updates:
  # 1. The workflows. `directory: "/"` makes the `github-actions` ecosystem scan
  #    `.github/workflows/`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Singapore"
    # Grouped below, so normally one PR is open. The headroom covers a bump held
    # back by a failing check with another landing behind it.
    open-pull-requests-limit: 5
    # Without this, Dependabot titles PRs `Bump <dep> from <a> to <b>`, which is
    # not a Conventional Commit. PRs are squashed and release-please reads the
    # squash subject, so an untyped subject gets no release entry. This gives
    # `chore(deps): ...`, which `scripts/commit-convention.ts` accepts.
    #
    # `ci-cli.yml` still skips bots in its title check: a title gate on a bot
    # would fail a required check on a PR no human can retitle.
    commit-message:
      prefix: "chore"
      include: "scope"
    # One PR for all workflow action bumps: the same reviewers read them together.
    # The composite actions below are kept out of this group (see the note there).
    groups:
      github-actions:
        patterns:
          - "*"

  # 2. The composite actions, as one entry over a glob.
  #
  #    The ecosystem is directory-scoped: `directory: "/"` reads a root
  #    `action.yml` (there is none) and `.github/workflows/`, nothing else. Any
  #    other directory is scanned for `*.yml`/`*.yaml` files, so a directory
  #    holding an `action.yml` is read as a manifest. `directories:` globs are
  #    expanded before the ecosystem runs, so each match behaves like a literal
  #    `directory:`. (From dependabot-core; the published docs do not say this.)
  #
  #    A glob, not one entry per directory, so a composite action added later is
  #    covered without editing this file. `*` is one level deep, which matches
  #    the `.github/actions/<dir>/action.yml` convention.
  #
  #    Ungrouped, so each directory's updates are separately attributable.
  #
  #    Dependabot reads this file from the default branch only. The repository's
  #    `/network/updates` page is the only place that confirms the glob matched;
  #    a glob that matches nothing fails quietly.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
