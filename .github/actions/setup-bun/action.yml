name: Setup Bun
description: Install Bun, restore the bun install cache, and run a frozen install. The cache is saved on main only.

runs:
  using: composite
  steps:
    # Bun version from the `packageManager` field in package.json, so the lockfile
    # writer and reader never differ.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    # setup-bun caches the bun binary, not the packages. Restore bun's global install
    # cache, keyed on the lockfile. Cold install is 40 to 70 s; warm is about 10 s.
    - name: Restore bun install cache
      id: restore-bun-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # `HUSKY=0` stops the `prepare` script from pointing `core.hooksPath` at
    # `.husky/_` on a runner. The hooks are a local convenience; `ci-cli` runs the
    # same checks over the whole tree.
    #
    # No lane commits into this checkout today (release-please and the badge use
    # the GitHub API; `scripts/publish-plugin.ts` commits in a fresh clone of
    # `wego/skills`). This is a precaution: a lane that later commits here would
    # otherwise fail a release on a pre-commit hook over a file it did not write.
    # `scripts/workflow-shape.test.ts` enforces no bare `bun install` outside this
    # action.
    - run: bun install --frozen-lockfile
      shell: bash
      env:
        HUSKY: 0

    # Save on main only. A cache saved on a PR branch is readable only by that
    # branch. main's cache is readable by every PR.
    #
    # Skip the save on an exact hit. The key is content-addressed by bun.lock, so an
    # existing key already holds the same bytes, and a second save loses the
    # reservation race to a sibling job.
    - name: Save bun install cache
      if: github.ref == 'refs/heads/main' && steps.restore-bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
