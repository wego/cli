name: Verify this build before anything is published
description: >-
  The four checks that stand between a bad build and the store, run identically on
  every platform the lane gates. Each of these was written twice — inline in
  `release` for linux-x64 and again in `leave-macos` for darwin-arm64 — which is
  how a second runner is reached, since two jobs cannot share steps. One definition
  means the two legs cannot drift.

  Every step here runs BEFORE publication. That is the whole point: a failure
  prevents a bad build from reaching anyone, where the same check after the ring
  advanced could only describe one — `cli/next` has no backward path.

inputs:
  asset:
    description: The built binary for this platform, e.g. wego-linux-x64.
    required: true
  version:
    description: The version this run is publishing.
    required: true

runs:
  using: composite
  steps:
    - name: Verify the binaries against the signed manifest
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        # One helper for both runners: linux has coreutils, the macOS image
        # does not. The formats are identical.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c SHA256SUMS.txt
        else
          shasum -a 256 -c SHA256SUMS.txt
        fi

    # SMOKE 1 — the built binaries actually run and carry the right baked
    # version + complete baked public config (linux-x64 runs natively on the
    # runner). `logout` loads config without making a network request, so it
    # catches a missed/misspelled static WEGO_BUILD_* read before publication —
    # every one of them except the PostHog key, which is optional and therefore
    # silent when missing, so it is asserted explicitly at the end of this step.
    - name: Smoke test built binaries
      env:
        VERSION: ${{ inputs.version }}
        # These binaries are newer than the channel they'd read, so the
        # new-version notice would stay quiet on its own — but relying on that
        # makes a comparison rule load-bearing for CI. Switch it off outright so
        # this step never depends on it, and never reaches the network.
        WEGO_CLI_NO_UPDATE_NOTICE: "1"
      shell: bash
      run: |
        set -euo pipefail
        # One binary, one name (#74 rung 7): a second name here would mean a
        # second build.
        binary="./dist/${{ inputs.asset }}"
        chmod +x "$binary"
        got=$("$binary" version)
        echo "wego version -> $got"
        [ "$got" = "$VERSION" ] || { echo "version mismatch: expected $VERSION, got $got" >&2; exit 1; }
        WEGO_CREDENTIALS_PATH="${RUNNER_TEMP}/wego-missing-credentials.json" "$binary" logout

        # THE ONE BAKED VALUE THE CHECKS ABOVE CANNOT SEE.
        #
        # `logout` proves the endpoint/client reads were inlined, because a missed
        # one makes it fail. A missed PostHog read does the opposite: the key is
        # OPTIONAL by design (`release-config.ts` does `|| undefined`), so an empty
        # one builds, runs and smokes exactly like a working build - it just returns
        # "skipped-unbaked" forever and posts nothing.
        #
        # That is not hypothetical. `WEGO_CLI_POSTHOG_PROJECT_KEY` did not survive
        # the wego-ai -> wego/cli cutover, and v1.1.0 through v1.2.1 shipped
        # telemetry-blind for two weeks (c0685ff). Every check in this lane was
        # green throughout. The gap was found by asking PostHog why no 1.2.x events
        # existed - i.e. from OUTSIDE, long after publication.
        #
        # `telemetryKeyBaked` reports the COMPILED-IN value, so the job-level
        # WEGO_CLI_TELEMETRY=0 above does not affect it and nothing this step could
        # set can fake it. `info target` builds its report from config and makes no
        # network request.
        # `|| true`: under `set -euo pipefail` a non-matching grep would abort the
        # step before the guard below could say why, turning the clearest failure
        # this check has (the field is gone) into a bare non-zero exit.
        baked=$("$binary" info target --json | grep -o '"telemetryKeyBaked":[^,}]*' | tr -d ' ' || true)
        echo "telemetry key -> ${baked:-<field missing>}"
        if [ "$baked" != '"telemetryKeyBaked":true' ]; then
          echo "::error::${{ inputs.asset }} baked NO PostHog key, so every install of $VERSION would send nothing and nothing downstream would notice. Set WEGO_CLI_POSTHOG_PROJECT_KEY at REPO level (the build job carries no environment:, so an environment-scoped var is invisible to it - that is how c0685ff happened). Refusing before anything is published."
          exit 1
        fi

    # THE EARLIEST POSSIBLE GATE ON THE v1.2.0 CLASS OF BUG, and deliberately
    # placed before the FIRST store write of the run.
    #
    # `apps/api`'s legacy bridge pin (wego/foundations#132) keys on one thing: a
    # `?dl=` request for ring `stable` whose user agent starts with `Bun/` is a
    # pre-relay 1.0.x install and is answered from the frozen `cli/cli-v1.1.0/`
    # bridge. The rule is ALLOW-BY-DEFAULT, so a build that fails to identify
    # itself is treated as legacy - and v1.2.0 shipped exactly that way, having
    # passed every check this lane had (wego/cli#25).
    #
    # The same measurement runs in `promote-cli.yml` before `cli/stable` moves.
    # It is repeated HERE because that was far too late: by then the bad bytes
    # are the immutable `cli/<tag>/` artifact, `cli/next` is serving them, a
    # GitHub Release names them, and the only remedy is another release. Asked
    # at this point, a failure costs a red run and nothing else - no prefix is
    # written, no pointer moves, no version is burned.
    #
    # NEEDS NO RING, which is what makes the early placement possible: the pin's
    # only input is the agent, and the agent is a property of the binary sitting
    # in ./dist. The update-outcome smokes further down genuinely cannot move
    # up - they ask whether a binary can complete an update against `cli/next`,
    # which cannot be answered until `cli/next` serves ${{ inputs.asset }}.
    #
    # WEGO_BUILD_VERSION IS DELIBERATELY NOT SET. `update` returns EXIT.OK
    # without acting for a dev-versioned binary (update.ts:364), so setting it
    # here would paper over a build that failed to bake its version and leave
    # the guard below asserting nothing. The step above has already proved
    # `wego version` reports $VERSION on its own.
    - name: Require ${{ inputs.asset }} to be distinguishable from a pre-relay install
      env:
        VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        url='https://api.wego.com/install'
        work="$RUNNER_TEMP/agent-probe"; rm -rf "$work"
        mkdir -p "$work/bin" "$work/home/.config/wego"

        # THE BINARY MUST BE NAMED `wego`: the config directory is derived from
        # the name it is invoked as, so `${{ inputs.asset }}` would look for
        # `.config/${{ inputs.asset }}/`, find no install record, and exit without
        # touching the network - a green check that measured nothing.
        cp ./dist/${{ inputs.asset }} "$work/bin/wego"
        chmod +x "$work/bin/wego"

        # A listener that records the agent and 404s. The 404 is fine: the agent
        # goes out on the FIRST request, which is all this needs.
        #
        # `bun -e`, not a heredoc: a heredoc body inside a YAML block scalar
        # carries the block's indentation into the file and has to be stripped
        # back out, which is a silent breakage waiting to happen in a lane
        # nothing lints.
        : > "$work/agent.txt"
        AGENT_FILE="$work/agent.txt" bun -e 'const out=Bun.file(process.env.AGENT_FILE).writer();Bun.serve({hostname:"127.0.0.1",port:8977,fetch(r){out.write((r.headers.get("user-agent")??"")+"\n");out.flush();return new Response("probe",{status:404});}});' &
        LPID=$!
        sleep 2

        printf '{"ring":"stable","installUrl":"http://127.0.0.1:8977/install"}\n' \
          > "$work/home/.config/wego/install.json"
        set +e
        out=$(HOME="$work/home" XDG_CONFIG_HOME="$work/home/.config" \
              WEGO_CLI_TELEMETRY=0 "$work/bin/wego" update -y 2>&1)
        set -e
        kill "$LPID" 2>/dev/null || true
        echo "$out"

        if printf '%s' "$out" | grep -q 'Self-update applies to installed release binaries'; then
          echo "::error::${{ inputs.asset }} does not consider itself a release binary, so it never made a request and this check measured NOTHING. It was built without WEGO_BUILD_VERSION."
          exit 1
        fi
        agent=$(head -1 "$work/agent.txt" || true)
        if [ -z "$agent" ]; then
          echo "::error::${{ inputs.asset }} made no request to the probe, so its user agent could not be measured and this check proved NOTHING. Output above."
          exit 1
        fi
        echo "$VERSION's binary sends: $agent"

        # The pin's own predicate, applied to the measured value.
        if printf '%s' "$agent" | grep -qiE '^bun/'; then
          echo "::error::${{ inputs.asset }} sends '$agent', which apps/api's legacy bridge pin treats as a pre-relay 1.0.x install. Every install of ${{ inputs.asset }} would be pinned to the frozen bridge, whose record it cannot verify - it could never update again. That is what v1.2.0 shipped (wego/cli#25). Refusing before anything is published."
          exit 1
        fi

        # And the real route's actual decision, which is the claim that matters.
        loc=$(curl -sI -A "$agent" "$url?dl=SHA256SUMS.txt&ring=stable" \
                | grep -i '^location:' || true)
        if printf '%s' "$loc" | grep -q '/cli/cli-v1.1.0/'; then
          echo "::error::api.wego.com serves ${{ inputs.asset }} ('$agent') from the legacy bridge on ring stable: '$loc'. Publishing it would strand every install of it."
          exit 1
        fi
        echo "ok: ${{ inputs.asset }} is not claimed by the pin. $loc"

    # Publish to the IMMUTABLE cli/<tag>/ ONLY (--freeze). cli/next is NOT
    # moved here — it advances only after SMOKE-2 verifies these exact bytes,
    # so a transport-corrupted upload can never become the served candidate.
    # REQUIRE_PUBLISH makes a deliberate release FAIL if the token is missing
    # (no silent "green but published nothing"); the tag-push path keeps the
    # graceful pre-go-live skip.
    #
    # Every release requires it: a run that quietly published nothing would report
    # green while `cli/next` still served the previous build, and the promote that
    # followed would move `cli/stable` onto bytes nobody meant to ship.
    #
    # No guard here against two runs colliding on one tag, and none is needed: a tag
    # names the commit whoever created it chose, and both entrypoints arrive with it
    # already created. The immutable prefix protects itself regardless of who writes
    # it - `putImmutableAssets` puts with `allowOverwrite: false`, and the
    # THE ANTI-BRICK GATE: this binary must be able to LEAVE, proven by making
    # it actually leave. Nothing has been published and no pointer has moved.
    #
    # THE FAILURE IT EXISTS FOR IS THE WORST ONE THIS PROJECT HAS. A build that
    # cannot `wego update` bricks every machine that takes it, and a rollback
    # does not rescue them: they already hold the broken binary, and a binary
    # that cannot update cannot take the rollback either. Reinstall by hand is
    # the only exit. v1.2.0 shipped exactly this (wego/cli#25).
    #
    # SMOKE 4 BELOW ALREADY ASKS THE QUESTION AND ACCEPTS A WEAKER ANSWER. It
    # runs this binary against `cli/next`, which by then serves these very bytes,
    # so the correct outcome is "already up to date" - and that is precisely
    # where `update` STOPS. The hashes match, so it never downloads, never
    # gunzips, never verifies a payload, never renames anything over itself. The
    # request path is covered; the REPLACE path ships unexercised. v1.2.0's bug
    # happened to be in the request, which is why that check was enough once and
    # is not enough in general.
    #
    # SO THIS ONE MAKES IT DO THE WHOLE THING. Pointed at `cli/stable` - which
    # still serves the OUTGOING release and which this lane never touches - the
    # new binary must fetch, decompress, checksum and atomically replace itself
    # in place. Downgrading is not a strange thing to ask of it: `update`
    # compares CHECKSUMS, not versions, so this is byte-for-byte the code path a
    # user's upgrade takes.
    #
    # IT NEEDS NOTHING PUBLISHED, which is why it sits here rather than after
    # the publish: the binary is in `dist/` and `cli/stable` is already live. A
    # failure costs a re-run and nobody outside this job has seen the build.
    #
    # COVERS linux-x64 ONLY, and for THIS direction that limit bites: the code
    # doing the work is the NEW code, freshly compiled per platform, and macOS
    # has a branch nothing here executes (the quarantine clear). See the release
    # notes/README before widening - a macos-latest leg would close it.
    - name: Require ${{ inputs.asset }} to be able to update itself for real
      env:
        VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        bin=./dist/${{ inputs.asset }}
        chmod +x "$bin"

        # A dev-versioned binary makes `update` return OK without acting, so a
        # gate handed one would go green having tested nothing. Assert the build
        # baked its version rather than hoping it did.
        got=$("$bin" version)
        if [ "$got" != "$VERSION" ]; then
          echo "::error::./dist/${{ inputs.asset }} reports '$got', not '$VERSION'. It was built without WEGO_BUILD_VERSION baked, so 'wego update' would exit OK without doing anything and this gate would prove nothing."
          exit 1
        fi

        outgoing=$(curl -fsSL 'https://api.wego.com/install?dl=VERSION&ring=stable' | tr -d '\r\n')
        if [ -z "$outgoing" ]; then
          echo "::error::cli/stable serves no VERSION, so there is nothing for ${{ inputs.asset }} to update ONTO and its replace path cannot be exercised. Refusing to publish a build whose ability to leave is unproven."
          exit 1
        fi
        if [ "$outgoing" = "$VERSION" ]; then
          echo "::error::cli/stable already serves $VERSION, so pointing ${{ inputs.asset }} at it would exercise no byte swap. Re-releasing a version that is already stable leaves the replace path untested - cut a new version instead."
          exit 1
        fi

        echo "making the new $VERSION binary install stable's $outgoing over itself..."
        if ! sh scripts/upgrade-path.sh "$bin" stable "$outgoing" --max-hops 1; then
          echo "::error::the $VERSION binary CANNOT UPDATE ITSELF. Publishing it would brick every machine that takes it - and a rollback would not reach them, because a binary that cannot update cannot take one either. This is wego/cli#25. Nothing has been published; fix the update path and re-tag. Exit 6 means a signed record ${{ inputs.asset }} refuses (check USER_AGENT and identitiesForRing); anything else is in the download, decompress, checksum or replace path."
          exit 1
        fi
        echo "ok: the $VERSION binary performs a real self-replace - it can leave."
