name: Sign the release manifest
description: >-
  Sign SHA256SUMS.txt with keyless cosign in the bundle format the publish gate
  reads. Fail here if the bundle is not that format.

# One definition for both publishing lanes (`edge-cli.yml`, `release-cli.yml`).
# The two lanes used to carry copies of this call, and the copies drifted twice:
# edge run 32930712877 and release run 32977203696 both died on a missing
# `--new-bundle-format`. Edge signs on every merge, so this copy is rehearsed
# before every release.
#
# A composite action runs inline in the caller and does not change the Fulcio
# identity. A reusable workflow would.
inputs:
  dist:
    description: >-
      Directory that holds SHA256SUMS.txt, relative to the workspace root. The
      bundle is written beside it. A composite action does not inherit the
      caller's working directory, so this is an input. Neither lane passes it.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign SHA256SUMS.txt
      shell: bash
      working-directory: ${{ inputs.dist }}
      run: |
        set -euo pipefail
        # `--new-bundle-format` is required. cosign 2.5.x writes the legacy bundle
        # by default. `@wego/release-signing` `parseBundle` reads only the Sigstore
        # protobuf bundle (`verificationMaterial`). The flag is the default in
        # cosign 3.x; it stays here so an installer bump cannot change the format.
        cosign sign-blob --yes \
          --new-bundle-format \
          --bundle SHA256SUMS.txt.sigstore.json \
          SHA256SUMS.txt
        test -s SHA256SUMS.txt.sigstore.json
        # Fail at the signer, not at the publish gate.
        grep -q '"verificationMaterial"' SHA256SUMS.txt.sigstore.json || {
          echo "cosign wrote a bundle with no verificationMaterial - the publish gate would refuse it." >&2
          exit 1
        }
        echo "Signed SHA256SUMS.txt -> SHA256SUMS.txt.sigstore.json"
