name: Verify the replace path
description: >-
  The post-pointer checks for one platform: a machine can arrive at this release,
  a machine can leave it, and the install script writes where this build reads.
  `release` runs them for wego-linux-x64 and `replace-macos` runs them for
  wego-darwin-arm64.

inputs:
  asset:
    description: The built binary for this platform, for example wego-linux-x64.
    required: true
  version:
    description: The version this run publishes.
    required: true
  predecessor-dir:
    description: Directory that holds the previously published binary and its SHA256SUMS.txt.
    required: true
  prev-usable:
    description: >-
      '1' when the ring held a complete predecessor. An empty ring skips the
      predecessor steps; there is nothing older to update from.
    required: true
  ring:
    description: The ring this release moved. The checks download from it.
    required: false
    default: next
  install-url:
    description: >-
      The real install route. Fixed on purpose. A check pointed at a loopback stub
      proves nothing about the route.
    required: false
    default: https://api.wego.com/install

  store-origin:
    description: >-
      The Blob origin this run published to. Empty when nothing was published,
      which skips the 1.1.0 hop.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The binaries arrived over an artifact hop. Check them against the manifest
    # before anything runs them. The macOS image has no coreutils; `shasum -a 256`
    # reads the same format.
    - name: Verify the binaries against the signed manifest (${{ inputs.asset }})
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c SHA256SUMS.txt
        else
          shasum -a 256 -c SHA256SUMS.txt
        fi

    # Duplicate of the step above. Harmless. Remove it in a code change.
    - name: Verify the binaries against the signed manifest (${{ inputs.asset }})
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c SHA256SUMS.txt
        else
          shasum -a 256 -c SHA256SUMS.txt
        fi

    # The next step runs the predecessor. Check its bytes against the manifest
    # captured beside it first.
    - name: Verify predecessor checksum (${{ inputs.asset }})
      if: inputs.prev-usable == '1'
      shell: bash
      env:
        DIR: ${{ inputs.predecessor-dir }}
        ASSET: ${{ inputs.asset }}
      run: |
        set -eu
        bin="$DIR/$ASSET"
        sums="$DIR/SHA256SUMS.txt"
        [ -f "$sums" ] || { echo "predecessor SHA256SUMS.txt missing — cannot verify before execution, failing." >&2; exit 1; }
        exp="$(awk -v f="$ASSET" '$2==f {print $1}' "$sums")"
        [ -n "$exp" ] || { echo "predecessor $ASSET not listed in SHA256SUMS.txt — failing." >&2; exit 1; }
        if command -v sha256sum >/dev/null 2>&1; then
          act="$(sha256sum "$bin" | awk '{print $1}')"
        else
          act="$(shasum -a 256 "$bin" | awk '{print $1}')"
        fi
        [ "$exp" = "$act" ] || { echo "predecessor checksum mismatch (expected $exp, got $act) — failing before execution." >&2; exit 1; }
        # The artifact hop drops the exec bit.
        chmod +x "$bin"
        echo "Predecessor verified fail-closed against SHA256SUMS.txt: $("$bin" version)"

    # SMOKE 3: arrive. The predecessor runs its own `update -y` against the ring.
    # `--require-replace` fails when the predecessor is already this version, so a
    # re-run cannot pass without a real replace.
    - name: SMOKE 3 · predecessor self-updates onto this release (${{ inputs.asset }})
      if: inputs.prev-usable == '1'
      shell: bash
      env:
        OLD_BINARY: ${{ inputs.predecessor-dir }}/${{ inputs.asset }}
        VERSION: ${{ inputs.version }}
        RING: ${{ inputs.ring }}
      run: sh scripts/update-smoke.sh "$OLD_BINARY" "$VERSION" --require-replace --ring "$RING"

    # SMOKE 4: leave, comparison half. The ring serves these bytes, so the expected
    # result is "already up to date", asserted. WEGO_BUILD_VERSION is set because
    # `update` exits 0 without acting for a dev-versioned binary, and
    # `assert-self-update.ts` refuses that case.
    - name: SMOKE 4 · this build reports up to date against ${{ inputs.ring }} (${{ inputs.asset }})
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ASSET: ${{ inputs.asset }}
        URL: ${{ inputs.install-url }}
        RING: ${{ inputs.ring }}
      run: |
        set -euo pipefail
        WEGO_BUILD_VERSION="$VERSION" \
          bun run scripts/assert-self-update.ts \
            "./dist/$ASSET" "$URL" "$RING" \
            --expect "$VERSION" --expect-unchanged

    # SMOKE 5: leave, replace half. SMOKE 4 returns before `downloadAndReplace`.
    # `--force-replace` runs this build's own fetch, checksum, chmod and atomic
    # rename. On darwin this reaches `clearQuarantine`, which no Linux runner can.
    - name: SMOKE 5 · forced in-place replace, this build's own code (${{ inputs.asset }})
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ASSET: ${{ inputs.asset }}
        URL: ${{ inputs.install-url }}
        RING: ${{ inputs.ring }}
      run: |
        set -euo pipefail
        WEGO_BUILD_VERSION="$VERSION" \
          bun run scripts/assert-self-update.ts \
            "./dist/$ASSET" "$URL" "$RING" \
            --expect "$VERSION" --force-replace

    # The 1.1.0 hop. The legacy bridge pin lands every 1.0.x install on the frozen
    # `cli/cli-v1.1.0/` prefix first, so 1.1.0 is the route for every older
    # install. Pinned, not derived: SMOKE 3's predecessor moves forward with every
    # release, and this one does not.
    - name: 1.1.0 upgrade path onto this release (${{ inputs.asset }})
      if: inputs.store-origin != ''
      shell: bash
      env:
        ORIGIN: ${{ inputs.store-origin }}
        VERSION: ${{ inputs.version }}
        ASSET: ${{ inputs.asset }}
        RING: ${{ inputs.ring }}
      run: |
        set -euo pipefail
        if ! sh scripts/upgrade-path.sh \
               "$ORIGIN/cli/cli-v1.1.0/$ASSET" "$RING" "$VERSION" --max-hops 1; then
          echo "::error::a 1.1.0 install of $ASSET cannot reach $VERSION on cli/$RING. Promoting this build would strand every install at or below 1.1.0 - and every 1.0.x machine too, since the legacy bridge pin lands it on 1.1.0 first. Exit 6 means a signed record 1.1.0 does not accept (check identitiesForRing and what this lane signed as); anything else is in the route, manifest, download or replace path."
          exit 1
        fi

    # SMOKE 6: the install contract. SMOKES 3 to 5 place a binary by hand. This one
    # runs the install script for real and checks that the record lands where the
    # installed binary reads it. The script's `uname` mapping differs per platform.
    - name: SMOKE 6 · the install script writes where this build reads (${{ inputs.asset }})
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        URL: ${{ inputs.install-url }}
        RING: ${{ inputs.ring }}
      run: sh scripts/install-smoke.sh "$URL" "$RING" "$VERSION"
